<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리집 미션 배틀</title>
  <style>
    /*
      ==============================
      Game Lobby Base
      ==============================
    */
    :root {
      --ink: #16214a;
      --muted: #7280a6;
      --panel: rgba(255, 255, 255, 0.94);
      --line: rgba(225, 233, 255, 0.95);
      --blue: #2f7bff;
      --sky: #32b7ff;
      --mint: #28df9b;
      --yellow: #ffd84d;
      --orange: #ff8845;
      --pink: #ff4fa3;
      --purple: #7c4dff;
      --danger: #ec4058;
      --radius: 22px;
      --shadow: 0 16px 0 rgba(9, 18, 62, 0.16), 0 28px 48px rgba(5, 10, 38, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 216, 77, 0.38), transparent 19%),
        radial-gradient(circle at 88% 14%, rgba(40, 223, 155, 0.26), transparent 23%),
        radial-gradient(circle at 52% 86%, rgba(255, 79, 163, 0.19), transparent 28%),
        linear-gradient(135deg, #101f63 0%, #6038c8 48%, #19b8e6 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.58), transparent 82%);
    }

    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.62; filter: grayscale(0.55); }

    .app {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 106px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      min-height: 118px;
      padding: 22px;
      border: 2px solid rgba(255, 255, 255, 0.28);
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08)),
        linear-gradient(135deg, rgba(27, 44, 126, 0.86), rgba(102, 57, 201, 0.74));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(34px, 6vw, 60px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: 0;
      text-shadow: 0 5px 0 rgba(13, 26, 83, 0.36), 0 12px 26px rgba(0, 0, 0, 0.22);
    }

    .hero p {
      margin: 10px 0 0;
      color: #ecf8ff;
      font-size: 18px;
      font-weight: 900;
    }

    .date-pill {
      display: grid;
      gap: 3px;
      min-width: 178px;
      padding: 13px 16px;
      border: 2px solid rgba(255, 255, 255, 0.58);
      border-radius: 999px;
      background: linear-gradient(135deg, #fff 0%, #dff6ff 100%);
      color: #173271;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(12, 28, 90, 0.22), 0 20px 34px rgba(0, 0, 0, 0.2);
      white-space: nowrap;
    }

    .date-pill small {
      color: var(--pink);
      font-size: 11px;
      font-weight: 1000;
    }

    /*
      ==============================
      Shared Components
      ==============================
    */
    .panel {
      border: 2px solid rgba(255, 255, 255, 0.38);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 17px 19px;
      border-bottom: 2px solid rgba(27, 47, 120, 0.09);
      background: linear-gradient(135deg, rgba(50, 183, 255, 0.14), rgba(124, 77, 255, 0.11));
    }

    .panel-head h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 1000;
      letter-spacing: 0;
    }

    .panel-body { padding: 18px; }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 7px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, #1c2f78, #2467ff);
      color: #fff;
      font-size: 13px;
      font-weight: 1000;
      border: 2px solid rgba(255, 255, 255, 0.46);
      box-shadow: 0 5px 0 rgba(12, 20, 68, 0.16);
      white-space: nowrap;
    }

    .btn {
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.52);
      color: #fff;
      background: linear-gradient(135deg, var(--sky), var(--blue));
      font-weight: 1000;
      box-shadow: 0 7px 0 rgba(13, 28, 83, 0.22), 0 14px 28px rgba(0, 0, 0, 0.16);
      transition: transform 0.13s ease, filter 0.13s ease, box-shadow 0.13s ease;
      touch-action: manipulation;
    }

    .btn:hover { filter: brightness(1.05); transform: translateY(-2px); }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 rgba(13, 28, 83, 0.24), 0 9px 18px rgba(0, 0, 0, 0.14);
    }

    .btn.alt { background: linear-gradient(135deg, #f7f9ff, #dfeaff); color: #1b3f95; border-color: #cbd9ff; }
    .btn.gold { background: linear-gradient(135deg, var(--yellow), var(--orange)); color: #4b2a00; }
    .btn.danger { background: linear-gradient(135deg, #ff7b8d, var(--danger)); }
    .btn.small { min-height: 40px; padding: 9px 12px; font-size: 14px; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .stack { display: grid; gap: 14px; }

    .stat {
      padding: 12px;
      border: 2px solid #e1e9ff;
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, #f0f5ff);
      box-shadow: inset 0 -4px 0 rgba(24, 50, 113, 0.06);
    }

    .stat span {
      display: block;
      color: #687494;
      font-size: 12px;
      font-weight: 1000;
      margin-bottom: 5px;
    }

    .stat strong {
      display: block;
      color: #14204d;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 1000;
    }

    .xp-bar {
      height: 24px;
      padding: 4px;
      border-radius: 999px;
      background: #1d2d6d;
      box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.23);
      overflow: hidden;
    }

    .xp-bar span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), var(--yellow), var(--orange));
      box-shadow: 0 0 16px rgba(255, 216, 77, 0.62);
      transition: width 0.3s ease;
    }

    /*
      ==============================
      Player Selector
      ==============================
    */
    .player-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
      margin: 16px 0;
    }

    .player-mini {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
      min-height: 92px;
      padding: 13px;
      border: 2px solid rgba(255, 255, 255, 0.42);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(238,244,255,0.96));
      box-shadow: 0 10px 0 rgba(9, 18, 62, 0.12), 0 18px 32px rgba(5, 10, 38, 0.18);
      text-align: left;
    }

    .player-mini.active {
      border-color: var(--yellow);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--kid-color) 30%, transparent), 0 12px 0 rgba(9, 18, 62, 0.15), 0 20px 38px rgba(5, 10, 38, 0.24);
    }

    .mini-avatar, .avatar-big {
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 5px solid #fff;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.82), transparent 24%),
        linear-gradient(135deg, color-mix(in srgb, var(--kid-color) 82%, #fff), var(--kid-color));
      color: #fff;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
      box-shadow: 0 9px 0 rgba(19, 33, 93, 0.16), 0 14px 28px rgba(0, 0, 0, 0.2);
    }

    .mini-avatar { width: 58px; height: 58px; font-size: 28px; }
    .avatar-big { width: 156px; height: 156px; font-size: 62px; }

    .avatar-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      z-index: 2;
    }

    .avatar-fallback {
      position: relative;
      z-index: 1;
    }

    .player-mini h3 { margin: 0; font-size: 22px; font-weight: 1000; }
    .player-mini p { margin: 5px 0 0; color: var(--muted); font-weight: 900; font-size: 13px; }

    /*
      ==============================
      Tabs
      ==============================
    */
    .tab-page { display: none; }
    .tab-page.active { display: block; animation: pagePop 0.18s ease; }

    .bottom-tabs {
      position: fixed;
      left: 50%;
      bottom: 12px;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(6, minmax(74px, 1fr));
      gap: 7px;
      width: min(760px, calc(100% - 20px));
      padding: 9px;
      border: 2px solid rgba(255,255,255,0.38);
      border-radius: 24px;
      background: rgba(18, 31, 92, 0.88);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.28);
      transform: translateX(-50%);
      backdrop-filter: blur(10px);
    }

    .tab-btn {
      display: grid;
      place-items: center;
      gap: 2px;
      min-height: 58px;
      padding: 7px 5px;
      border-radius: 17px;
      color: #d9e7ff;
      background: rgba(255,255,255,0.08);
      font-size: 12px;
      font-weight: 1000;
    }

    .tab-btn b { font-size: 20px; line-height: 1; }
    .tab-btn.active { background: linear-gradient(135deg, var(--yellow), var(--orange)); color: #3f2500; box-shadow: inset 0 -4px 0 rgba(92, 45, 0, 0.15); }

    /*
      ==============================
      Character
      ==============================
    */
    .character-layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.2fr);
      gap: 16px;
      align-items: stretch;
    }

    .character-stage {
      position: relative;
      display: grid;
      justify-items: center;
      align-content: center;
      min-height: 430px;
      padding: 24px;
      border-radius: 28px;
      background: var(--stage-bg, linear-gradient(135deg, #dff6ff, #fff4c4));
      border: 2px solid #fff;
      overflow: hidden;
      box-shadow: inset 0 -10px 0 rgba(24, 50, 113, 0.08);
    }

    .character-stage.defender {
      background:
        radial-gradient(circle at 50% 42%, rgba(47, 123, 255, 0.38), transparent 34%),
        linear-gradient(135deg, #dff1ff, #e9f0ff 48%, #fff4c4);
    }

    .character-stage.runner {
      background:
        radial-gradient(circle at 50% 42%, rgba(40, 223, 155, 0.34), transparent 34%),
        linear-gradient(135deg, #e2fff4, #e9fff8 48%, #e7f7ff);
    }

    .character-stage.fighter {
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 136, 69, 0.38), transparent 34%),
        linear-gradient(135deg, #fff0df, #fff6e4 48%, #ffe5d8);
    }

    .character-stage::before {
      content: "";
      position: absolute;
      inset: 24px;
      border: var(--frame-border, 0 solid transparent);
      border-radius: 28px;
      pointer-events: none;
    }

    .aura {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 999px;
      background: var(--aura-bg, transparent);
      filter: blur(18px);
      opacity: var(--aura-opacity, 0);
      animation: pulseGlow 2s ease-in-out infinite;
    }

    .avatar-wrap { position: relative; z-index: 1; display: grid; place-items: center; }
    .avatar-wrap::before,
    .avatar-wrap::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
    }

    .avatar-wrap::before {
      width: 210px;
      height: 210px;
      border: 4px solid color-mix(in srgb, var(--kid-color) 55%, transparent);
      box-shadow: 0 0 34px color-mix(in srgb, var(--kid-color) 42%, transparent);
      animation: heroAura 2.6s ease-in-out infinite;
    }

    .avatar-wrap::after {
      width: 118px;
      height: 18px;
      bottom: -16px;
      background: rgba(18, 31, 92, 0.18);
      filter: blur(2px);
    }

    .class-mark {
      position: absolute;
      left: 50%;
      bottom: 88px;
      z-index: 2;
      translate: -50% 0;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.84);
      border: 2px solid rgba(255, 255, 255, 0.95);
      color: #16214a;
      font-size: 13px;
      font-weight: 1000;
      box-shadow: 0 7px 0 rgba(9, 18, 62, 0.12);
    }
    .head-item { position: absolute; top: -13px; z-index: 2; font-size: 42px; }
    .pet-item { position: absolute; right: -42px; bottom: 4px; z-index: 2; font-size: 46px; }

    .character-stage.defender .avatar-wrap { animation: guardianFloat 3.2s ease-in-out infinite; }
    .character-stage.runner .avatar-wrap { animation: runnerFlash 1.9s ease-in-out infinite; }
    .character-stage.fighter .avatar-wrap { animation: fighterFlame 2.4s ease-in-out infinite; }
    .character-stage.defender .avatar-big { box-shadow: 0 12px 0 rgba(19, 33, 93, 0.18), 0 0 34px rgba(47, 123, 255, 0.34); }
    .character-stage.runner .avatar-big { box-shadow: 0 12px 0 rgba(19, 33, 93, 0.18), 0 0 34px rgba(40, 223, 155, 0.34); }
    .character-stage.fighter .avatar-big { box-shadow: 0 12px 0 rgba(19, 33, 93, 0.18), 0 0 34px rgba(255, 136, 69, 0.42); }

    .nickname {
      position: relative;
      z-index: 1;
      margin: 18px 0 8px;
      font-size: 32px;
      font-weight: 1000;
      text-align: center;
    }

    .equipped-line {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
    }

    .next-reward {
      padding: 16px;
      border: 2px solid #ffe47b;
      border-radius: 22px;
      background: linear-gradient(135deg, #fff7cf, #ffe794);
      box-shadow: 0 8px 0 rgba(98, 63, 0, 0.12);
    }

    .next-reward.featured {
      border-width: 3px;
      background:
        radial-gradient(circle at 16% 18%, rgba(255,255,255,0.9), transparent 26%),
        linear-gradient(135deg, #fff7bf, #ffd84d 52%, #ff9c45);
      box-shadow: 0 12px 0 rgba(98, 63, 0, 0.16), 0 20px 34px rgba(255, 136, 69, 0.24);
    }

    .next-reward h3 { margin: 0 0 8px; font-size: 24px; font-weight: 1000; color: #4b2a00; }
    .next-reward p { margin: 0; color: #6a4a00; font-size: 17px; font-weight: 1000; }

    .equipped-board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .equip-chip {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
      min-height: 48px;
      padding: 9px 10px;
      border: 2px solid #e1e9ff;
      border-radius: 16px;
      background: linear-gradient(180deg, #fff, #f3f7ff);
      font-weight: 1000;
    }

    .equip-chip small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 2px;
    }

    /*
      ==============================
      Cards
      ==============================
    */
    .mission-card, .shop-card, .inventory-card, .league-card, .log-card, .team-card {
      position: relative;
      display: grid;
      gap: 10px;
      padding: 15px;
      border: 2px solid #e1e9ff;
      border-radius: 22px;
      background: linear-gradient(180deg, #ffffff, #f4f8ff);
      box-shadow: 0 10px 0 rgba(26, 44, 105, 0.08), 0 16px 26px rgba(13, 28, 83, 0.09);
      overflow: hidden;
    }

    .mission-card.clear { border-color: rgba(40, 223, 155, 0.72); background: linear-gradient(180deg, #effff9, #dcfff1); animation: clearBounce 0.42s ease; }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .icon-box {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border: 2px solid #e1e9ff;
      border-radius: 18px;
      background: #fff;
      font-size: 30px;
      box-shadow: inset 0 -4px 0 rgba(24, 50, 113, 0.07);
      flex: 0 0 auto;
    }

    .card-title { margin: 0; font-size: 18px; font-weight: 1000; line-height: 1.25; }
    .card-sub { margin: 0; color: var(--muted); font-weight: 900; line-height: 1.45; }
    .reward-line { color: #0c9d70; font-weight: 1000; }
    .locked { background: linear-gradient(180deg, #f9fbff, #edf2ff); }

    .shop-card {
      min-height: 218px;
      align-content: start;
    }

    .shop-card.next-target {
      border-color: var(--yellow);
      box-shadow: 0 0 0 4px rgba(255, 216, 77, 0.18), 0 10px 0 rgba(26, 44, 105, 0.08), 0 18px 30px rgba(255, 136, 69, 0.18);
    }

    .state-pill {
      display: inline-flex;
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef4ff;
      color: #29458d;
      font-size: 12px;
      font-weight: 1000;
    }

    .state-pill.ready { background: #ddfff2; color: #087755; }
    .state-pill.target { background: #fff4c4; color: #704700; }
    .state-pill.lock { background: #edf1fb; color: #65708f; }
    .state-pill.equipped { background: #e9ddff; color: #4d2aa0; }

    .challenge-box {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
      padding: 15px;
      border: 2px solid rgba(255, 255, 255, 0.78);
      border-radius: 22px;
      background: linear-gradient(135deg, #fff7cf, #e3f7ff);
      box-shadow: 0 8px 0 rgba(26, 44, 105, 0.08);
      font-weight: 1000;
    }

    .challenge-box h3 { margin: 0; font-size: 20px; }
    .challenge-box p { margin: 0; color: #556181; line-height: 1.45; }

    .notice-board,
    .vote-board,
    .photo-studio {
      padding: 15px;
      border: 2px solid rgba(255,255,255,0.78);
      border-radius: 24px;
      background: linear-gradient(135deg, #fff7cf, #e3f7ff);
      box-shadow: 0 8px 0 rgba(26, 44, 105, 0.08);
    }

    .notice-board h3,
    .vote-board h3,
    .photo-studio h3 {
      margin: 0 0 10px;
      font-size: 21px;
      font-weight: 1000;
    }

    .notice-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .notice-list li {
      padding: 9px 11px;
      border-radius: 16px;
      background: rgba(255,255,255,0.62);
      color: #556181;
      font-weight: 1000;
    }

    .vote-card {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 2px solid #e1e9ff;
      border-radius: 18px;
      background: rgba(255,255,255,0.76);
    }

    .vote-result {
      height: 16px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(29, 45, 109, 0.18);
      overflow: hidden;
    }

    .vote-result span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), var(--sky));
    }

    .photo-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 12px;
    }

    .team-photo {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      min-height: 280px;
      padding: 18px;
      border: 3px solid rgba(255,255,255,0.8);
      border-radius: 26px;
      background: var(--photo-bg, linear-gradient(135deg, #dff6ff, #fff4c4));
      box-shadow: inset 0 -10px 0 rgba(24, 50, 113, 0.08);
    }

    .team-photo.space { --photo-bg: linear-gradient(135deg, #131852, #572cb8 50%, #111); }
    .team-photo.fire { --photo-bg: linear-gradient(135deg, #531b15, #ff8845 56%, #ffd84d); }
    .team-photo.lightning { --photo-bg: linear-gradient(135deg, #073a43, #20b486 52%, #d9fff4); }
    .team-photo.camp { --photo-bg: linear-gradient(135deg, #d9f8ce, #fff1b8 54%, #ffca83); }

    .photo-player {
      display: grid;
      justify-items: center;
      align-content: end;
      gap: 8px;
      min-height: 230px;
      padding: 12px;
      border-radius: 22px;
      background: rgba(255,255,255,0.56);
      text-align: center;
      font-weight: 1000;
    }

    .photo-player .mini-avatar {
      width: 86px;
      height: 86px;
      font-size: 42px;
    }

    .empty {
      padding: 22px;
      border: 2px dashed #cbd7f3;
      border-radius: 22px;
      background: #f7f9ff;
      color: var(--muted);
      text-align: center;
      font-weight: 1000;
    }

    .league-awards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .award-card {
      padding: 14px;
      border-radius: 22px;
      background: linear-gradient(135deg, #fff7cf, #e3f7ff);
      border: 2px solid rgba(255,255,255,0.78);
      box-shadow: 0 8px 0 rgba(26, 44, 105, 0.08);
      text-align: center;
      font-weight: 1000;
    }

    .award-card b { display: block; font-size: 26px; margin-bottom: 6px; }

    /*
      ==============================
      Parent Menu
      ==============================
    */
    .parent-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr auto auto;
      gap: 10px;
      align-items: end;
    }

    .field label {
      display: block;
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 1000;
    }

    input, select {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 2px solid #d5def3;
      border-radius: 16px;
      background: #fff;
      color: var(--ink);
      font-weight: 900;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 123, 255, 0.16);
    }

    .parent-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 13px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 92px;
      z-index: 30;
      max-width: calc(100% - 32px);
      padding: 13px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #172860, #2467ff);
      color: #fff;
      font-weight: 1000;
      border: 2px solid rgba(255,255,255,0.45);
      box-shadow: 0 9px 0 rgba(12,20,68,0.2), 0 22px 34px rgba(0,0,0,0.24);
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(18px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast strong {
      display: block;
      margin-bottom: 2px;
      font-size: 15px;
    }

    .toast span {
      display: block;
      font-size: 13px;
      color: #e7f2ff;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes pagePop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes clearBounce { 0% { transform: scale(1); } 45% { transform: scale(1.025); } 100% { transform: scale(1); } }
    @keyframes pulseGlow { 0%,100% { transform: scale(0.94); opacity: var(--aura-opacity, 0); } 50% { transform: scale(1.08); opacity: calc(var(--aura-opacity, 0) + 0.12); } }
    @keyframes heroAura { 0%, 100% { scale: 0.94; opacity: 0.72; } 50% { scale: 1.04; opacity: 1; } }
    @keyframes guardianFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes runnerFlash { 0%,100% { transform: translateX(0); filter: brightness(1); } 45% { transform: translateX(4px); filter: brightness(1.18); } 52% { transform: translateX(-3px); } }
    @keyframes fighterFlame { 0%,100% { transform: translateY(0) rotate(-1deg); filter: saturate(1); } 50% { transform: translateY(-5px) rotate(1deg); filter: saturate(1.2); } }

    /*
      ==============================
      Tablet / Phone
      ==============================
    */
    @media (max-width: 980px) {
      .hero, .character-layout, .grid-2, .grid-3, .league-awards { grid-template-columns: 1fr; }
      .player-strip { grid-template-columns: 1fr; }
      .parent-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 680px) {
      .app { width: min(100% - 16px, 1180px); padding-top: 10px; padding-bottom: 132px; }
      .hero { grid-template-columns: 1fr auto; min-height: auto; padding: 13px 14px; border-radius: 20px; gap: 10px; }
      .hero h1 { font-size: 28px; }
      .hero p { display: none; }
      .date-pill { justify-self: end; min-width: 0; min-height: 46px; padding: 8px 11px; font-size: 12px; }
      .date-pill small { font-size: 9px; }
      .player-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin: 9px 0 12px; }
      .player-mini { grid-template-columns: 1fr; justify-items: center; gap: 5px; min-height: 86px; padding: 8px 6px; border-radius: 16px; text-align: center; }
      .mini-avatar { width: 42px; height: 42px; border-width: 3px; font-size: 22px; }
      .player-mini h3 { font-size: 15px; }
      .player-mini p { margin-top: 2px; font-size: 10px; line-height: 1.2; }
      .panel-head { align-items: flex-start; flex-direction: column; }
      .parent-grid { grid-template-columns: 1fr; }
      .bottom-tabs { grid-template-columns: repeat(3, 1fr); }
      .tab-btn { min-height: 54px; }
      .avatar-big { width: 134px; height: 134px; font-size: 54px; }
      .avatar-wrap::before { width: 178px; height: 178px; }
      .class-mark { bottom: 70px; font-size: 12px; }
      .character-stage { min-height: 360px; }
      .btn { width: 100%; }
    }

      { id: "fire_aura", type: "aura", name: "불꽃 오라", icon: "🔥", level: 4, cost: 220 },

    const FAMILY_REWARDS = [
      { id: "store_with_dad", title: "아빠랑 편의점 가기", cost: 100, rarity: "COMMON" },
      { id: "game_30", title: "게임 30분 추가권", cost: 150, rarity: "RARE" },
      { id: "snack", title: "원하는 간식 고르기", cost: 200, rarity: "RARE" },
      { id: "movie", title: "주말 영화 선택권", cost: 300, rarity: "EPIC" },
      { id: "chicken", title: "치킨 메뉴 선택권", cost: 500, rarity: "EPIC" },
      { id: "family_trip", title: "가족 나들이 의견권", cost: 800, rarity: "LEGEND" },
      { id: "special_gift", title: "특별 선물 협상권", cost: 1000, rarity: "MYTHIC" }
    ];

    const FAMILY_MISSIONS = [
      { id: "all_3", required: 3, bonusXp: 30, bonusCoins: 30, label: "세 명 모두 오늘 미션 3개 이상 클리어" },
      { id: "all_5", required: 5, bonusXp: 50, bonusCoins: 50, label: "세 명 모두 오늘 미션 5개 이상 클리어" }
    ];

    const UPDATE_NOTICES = [
      "다음 주 새 미션이 열려요!",
      "새로운 장비가 곧 등장해요!",
      "형제 리그 시즌 이벤트 준비 중!",
      "다음 업데이트까지 미션을 클리어하고 코인을 모아두세요!"
    ];

    const MISSION_VOTE_CANDIDATES = [
      { id: "stretch", title: "아침 스트레칭 하기", icon: "🤸" },
      { id: "thanks", title: "가족에게 고마운 말 하기", icon: "💬" },
      { id: "room_5", title: "방 5분 정리하기", icon: "🧹" },
      { id: "reading_20", title: "줄글책 20분 읽기", icon: "📘" },
      { id: "praise", title: "형제 칭찬하기", icon: "👏" },
      { id: "house_help", title: "가족을 도와 집안일 1가지 하기", icon: "🏠" }
    ];

    const PHOTO_BACKGROUNDS = [
      { id: "default", name: "기본 배경" },
      { id: "space", name: "우주 배경" },
      { id: "fire", name: "불꽃 경기장" },
      { id: "lightning", name: "번개 아레나" },
      { id: "camp", name: "가족 캠프" }
    ];

    /*
      ==============================
      앱 동작 영역
      ==============================
    */
    let selectedKidId = KIDS[0].id;
    let activeTab = "character";
    let parentOpen = false;
    let parentUnlocked = false;
    let toastTimer = null;
    let state = loadState();

    const els = {
      todayDate: document.getElementById("todayDate"),
      playerStrip: document.getElementById("playerStrip"),
      toast: document.getElementById("toast")
    };

    function getTodayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    function getWeekKey(date = new Date()) {
      const first = new Date(date.getFullYear(), 0, 1);
      const days = Math.floor((date - first) / 86400000);
      return `${date.getFullYear()}-W${String(Math.ceil((days + first.getDay() + 1) / 7)).padStart(2, "0")}`;
    }

    function getYesterdayKey() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function formatKoreanDate(dateKey) {
      const [y, m, d] = dateKey.split("-");
      const date = new Date(Number(y), Number(m) - 1, Number(d));
      return `${y}년 ${Number(m)}월 ${Number(d)}일 (${["일", "월", "화", "수", "목", "금", "토"][date.getDay()]})`;
    }

    function makeKidData(kid, old = {}) {
      const xp = Number(old.xp ?? old.totalPoints ?? 0);
      const coins = Number(old.coins ?? old.currentPoints ?? 0);
      const inventory = Array.isArray(old.inventory) ? old.inventory : ["basic_avatar", "basic_bg"];
      if (!inventory.includes("basic_avatar")) inventory.push("basic_avatar");
      if (!inventory.includes("basic_bg")) inventory.push("basic_bg");

      return {
        nickname: old.nickname || kid.nickname || kid.name,
        avatar: old.avatar || kid.avatar,
        xp,
        coins,
        currentPoints: coins,
        totalPoints: xp,
        todayDone: old.todayDone || {},
        inventory,
        badges: Array.isArray(old.badges) ? old.badges : [],
        equippedItems: {
          avatar: old.equippedItems?.avatar || "basic_avatar",
          background: old.equippedItems?.background || "basic_bg",
          head: old.equippedItems?.head || null,
          aura: old.equippedItems?.aura || null,
          pet: old.equippedItems?.pet || null,
          frame: old.equippedItems?.frame || null,
          title: old.equippedItems?.title || null,
          badge: old.equippedItems?.badge || null
        },
        stats: {
          weekKey: old.stats?.weekKey || getWeekKey(),
          weeklyXp: Number(old.stats?.weeklyXp || 0),
          streakDays: Number(old.stats?.streakDays || 0),
          lastActiveDate: old.stats?.lastActiveDate || null
        },
        photoPose: old.photoPose || "ready",
        favoriteBackground: old.favoriteBackground || "default"
      };
    }

    function makeGameMeta(old = {}) {
      const oldVotes = old.missionVotes?.votes || {};
      return {
        version: "1.2",
        updateNotices: Array.isArray(old.updateNotices) && old.updateNotices.length ? old.updateNotices : UPDATE_NOTICES,
        teamPhotoBackground: old.teamPhotoBackground || "default",
        missionVotes: {
          candidates: MISSION_VOTE_CANDIDATES,
          votes: {
            jinwoo: oldVotes.jinwoo || null,
            jinyoung: oldVotes.jinyoung || null,
            jinhwan: oldVotes.jinhwan || null
          }
        },
        missionIdeas: Array.isArray(old.missionIdeas) ? old.missionIdeas : []
      };
    }

    function makeInitialState() {
      const kids = {};
      KIDS.forEach((kid) => { kids[kid.id] = makeKidData(kid); });
      return { version: 2, date: getTodayKey(), selectedKidId: KIDS[0].id, kids, familyBonuses: {}, history: [], activeTab: "character", gameMeta: makeGameMeta() };
    }

    function loadState() {
      let loaded = null;
      try { loaded = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (error) { loaded = null; }
      const base = loaded && typeof loaded === "object" ? loaded : makeInitialState();
      const today = getTodayKey();
      const weekKey = getWeekKey();
      const migrated = {
        version: 2,
        date: base.date || today,
        selectedKidId: base.selectedKidId || KIDS[0].id,
        activeTab: base.activeTab || "character",
        familyBonuses: base.familyBonuses || {},
        gameMeta: makeGameMeta(base.gameMeta),
        history: Array.isArray(base.history) ? base.history.slice(0, 30) : [],
        kids: {}
      };

      KIDS.forEach((kid) => {
        migrated.kids[kid.id] = makeKidData(kid, base.kids?.[kid.id]);
        if (migrated.kids[kid.id].stats.weekKey !== weekKey) {
          migrated.kids[kid.id].stats.weekKey = weekKey;
          migrated.kids[kid.id].stats.weeklyXp = 0;
        }
      });

      if (migrated.date !== today) {
        migrated.date = today;
        migrated.familyBonuses = {};
        KIDS.forEach((kid) => { migrated.kids[kid.id].todayDone = {}; });
      }

      selectedKidId = KIDS.some((kid) => kid.id === migrated.selectedKidId) ? migrated.selectedKidId : KIDS[0].id;
      activeTab = migrated.activeTab || "character";
      localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
      return migrated;
    }

    function saveState() {
      state.selectedKidId = selectedKidId;
      state.activeTab = activeTab;
      KIDS.forEach((kid) => {
        const data = state.kids[kid.id];
        data.currentPoints = data.coins;
        data.totalPoints = data.xp;
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function kidConfig(id) { return KIDS.find((kid) => kid.id === id) || KIDS[0]; }
    function kidData(id = selectedKidId) { return state.kids[id]; }
    function itemById(id) { return DECOR_ITEMS.find((item) => item.id === id); }
    function doneCount(id) { return QUESTS.filter((quest) => kidData(id).todayDone?.[quest.id]).length; }
    function avatarIcon(data, kid) {
      const equippedAvatar = itemById(data.equippedItems?.avatar);
      return equippedAvatar && equippedAvatar.id !== "basic_avatar" ? equippedAvatar.icon : (data.avatar || kid.avatar);
    }
    function avatarMarkup(data, kid, className) {
      const icon = avatarIcon(data, kid);
      const image = kid.image || "";
      return `
        <span class="${className}">
          ${image ? `<img class="avatar-img" src="${image}" alt="${kid.name} 캐릭터 이미지" onerror="this.style.display='none'">` : ""}
          <span class="avatar-fallback">${icon}</span>
        </span>`;
    }
    function equippedItem(data, type) {
      return itemById(data.equippedItems?.[type]) || null;
    }
    function equipLabel(data, type, fallback) {
      const item = equippedItem(data, type);
      return item ? `${item.icon} ${item.name}` : fallback;
    }
    function className(kidId) {
      return { jinwoo: "방패 용사 · 방어형", jinyoung: "번개 러너 · 스피드형", jinhwan: "불꽃 파이터 · 공격형" }[kidId] || "미션 플레이어";
    }
    function classCss(kidId) {
      return { jinwoo: "defender", jinyoung: "runner", jinhwan: "fighter" }[kidId] || "";
    }
    function defaultAvatarChoices() {
      return ["🛡️", "⚡", "🔥", "🦸", "🤖", "🥷", "🐲", "👑", "🚀"];
    }

    function levelInfo(xp) {
      let current = LEVELS[0];
      let next = null;
      for (let i = 0; i < LEVELS.length; i += 1) {
        if (xp >= LEVELS[i].min) {
          current = LEVELS[i];
          next = LEVELS[i + 1] || null;
        }
      }
      const range = next ? next.min - current.min : 1;
      const progress = next ? Math.min(100, ((xp - current.min) / range) * 100) : 100;
      const remain = next ? Math.max(0, next.min - xp) : 0;
      return { current, next, progress, remain };
    }

    function nextUnlock(level) {
      return DECOR_ITEMS.find((item) => item.level > level) || null;
    }

    function addHistory(text) {
      const now = new Date();
      state.history.unshift({ text, time: `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}` });
      state.history = state.history.slice(0, 30);
    }

    function addXpCoins(id, xp, coins) {
      const data = kidData(id);
      data.xp += xp;
      data.coins += coins;
      data.stats.weeklyXp += xp;
      const today = getTodayKey();
      if (data.stats.lastActiveDate !== today) {
        data.stats.streakDays = data.stats.lastActiveDate === getYesterdayKey() ? data.stats.streakDays + 1 : 1;
        data.stats.lastActiveDate = today;
      }
      data.currentPoints = data.coins;
      data.totalPoints = data.xp;
    }

    function spendCoins(id, coins) {
      const data = kidData(id);
      data.coins = Math.max(0, data.coins - coins);
      data.currentPoints = data.coins;
    }

    function syncBadges(id) {
      const data = kidData(id);
      const badges = new Set(data.badges || []);
      if (doneCount(id) >= 3) badges.add("오늘의 미션왕");
      if (data.stats.streakDays >= 3) badges.add("연속 성공왕");
      if (data.stats.weeklyXp >= 100) badges.add("이번 주 성장왕");
      if (levelInfo(data.xp).current.level >= 5) badges.add("챔피언 배지");
      data.badges = Array.from(badges);
    }

    function completeQuest(questId) {
      const quest = QUESTS.find((q) => q.id === questId);
      const data = kidData();
      const kid = kidConfig(selectedKidId);
      if (!quest || data.todayDone[questId]) return;
      const beforeLevel = levelInfo(data.xp).current.level;
      data.todayDone[questId] = true;
      addXpCoins(selectedKidId, quest.xp, quest.coins);
      syncBadges(selectedKidId);
      const afterLevel = levelInfo(data.xp).current.level;
      addHistory(`${kid.name}가 ${quest.title} 미션 클리어! +${quest.xp} XP / +${quest.coins} 코인`);
      const remain = levelInfo(data.xp).remain;
      const extra = afterLevel > beforeLevel
        ? `레벨업! 레벨 ${afterLevel} 새 아이템을 확인해봐!`
        : remain === 0
          ? "최고 레벨 도전 완료!"
          : `좋아! 다음 레벨까지 ${remain} XP!`;
      saveAndRender(`<strong>미션 클리어! +${quest.xp} XP / +${quest.coins} 코인</strong><span>${extra}</span>`);
    }

    function undoQuest(questId) {
      const quest = QUESTS.find((q) => q.id === questId);
      const data = kidData();
      const kid = kidConfig(selectedKidId);
      if (!quest || !data.todayDone[questId]) return;
      delete data.todayDone[questId];
      data.coins = Math.max(0, data.coins - quest.coins);
      data.xp = Math.max(0, data.xp - quest.xp);
      data.stats.weeklyXp = Math.max(0, data.stats.weeklyXp - quest.xp);
      addHistory(`${kid.name}: ${quest.title} 미션 되돌리기 -${quest.xp} XP / -${quest.coins} 코인`);
      saveAndRender("<strong>미션을 되돌렸어요</strong><span>XP와 코인을 원래대로 조정했습니다.</span>");
    }

    function claimFamilyMission(id) {
      const mission = FAMILY_MISSIONS.find((m) => m.id === id);
      if (!mission || state.familyBonuses[id]) return;
      if (!KIDS.every((kid) => doneCount(kid.id) >= mission.required)) return;
      KIDS.forEach((kid) => { addXpCoins(kid.id, mission.bonusXp, mission.bonusCoins); syncBadges(kid.id); });
      state.familyBonuses[id] = true;
      addHistory(`팀 미션 클리어! 모두에게 +${mission.bonusXp} XP / +${mission.bonusCoins} 코인`);
      saveAndRender(`팀 보너스 +${mission.bonusXp} XP / +${mission.bonusCoins} 코인`);
    }

    function buyDecorItem(id) {
      const item = itemById(id);
      const data = kidData();
      const lvl = levelInfo(data.xp).current.level;
      if (!item || data.inventory.includes(id) || lvl < item.level || data.coins < item.cost) return;
      if (!confirm(`${item.name}을 ${item.cost} 코인으로 구매할까요?`)) return;
      spendCoins(selectedKidId, item.cost);
      data.inventory.push(id);
      addHistory(`${kidConfig(selectedKidId).name}이 꾸미기 아이템 구매! ${item.name} -${item.cost} 코인`);
      saveAndRender(`${item.name} 구매 완료! 보관함에서 착용하세요.`);
    }

    function useFamilyReward(id) {
      const reward = FAMILY_REWARDS.find((r) => r.id === id);
      const data = kidData();
      if (!reward || data.coins < reward.cost) return;
      if (!confirm(`${kidConfig(selectedKidId).name}의 ${reward.cost} 코인으로 "${reward.title}" 보상을 교환할까요?`)) return;
      spendCoins(selectedKidId, reward.cost);
      addHistory(`${kidConfig(selectedKidId).name}이 가족 보상 교환! ${reward.title} -${reward.cost} 코인`);
      saveAndRender("가족 보상을 교환했습니다.");
    }

    function equipItem(id) {
      const item = itemById(id);
      const data = kidData();
      if (!item || !data.inventory.includes(id)) return;
      data.equippedItems[item.type] = id;
      if (item.type === "badge" && !data.badges.includes(item.name)) data.badges.push(item.name);
      saveAndRender(`${item.name} 착용 완료`);
    }

    function unequipItem(type) {
      const data = kidData();
      if (type === "avatar" || type === "background") return;
      data.equippedItems[type] = null;
      saveAndRender("착용을 해제했습니다.");
    }

    function submitMissionIdea() {
      const input = document.getElementById("missionIdeaInput");
      if (!input) return;
      const text = input.value.trim().replace(/\s+/g, " ");
      if (text.length < 3) {
        showToast("아이디어를 3글자 이상 적어주세요.");
        return;
      }
      if (text.length > 60) {
        showToast("아이디어는 60글자 안으로 짧게 적어주세요.");
        return;
      }
      const ideas = state.gameMeta.missionIdeas || [];
      const duplicated = ideas.some((idea) => idea.kidId === selectedKidId && idea.text === text);
      if (duplicated) {
        showToast("이미 저장된 아이디어예요. 새로운 아이디어를 적어보세요!");
        return;
      }
      const kid = kidConfig(selectedKidId);
      ideas.unshift({
        id: `idea_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        kidId: selectedKidId,
        kidName: kid.name,
        text,
        createdAt: new Date().toISOString(),
        status: "pending"
      });
      state.gameMeta.missionIdeas = ideas.slice(0, 50);
      input.value = "";
      addHistory(`${kid.name}: 새 미션 아이디어 제출 - ${text}`);
      saveAndRender("좋은 아이디어예요! 다음 업데이트 후보에 저장됐어요.");
    }

    function updateMissionIdeaStatus(id, status) {

      idea.status = status;
      saveAndRender("아이디어 상태를 바꿨습니다.");

    function renderLeague() {
      KIDS.forEach((kid) => syncBadges(kid.id));
      const missionKing = KIDS.reduce((a, b) => doneCount(a.id) >= doneCount(b.id) ? a : b);
      const growthKing = KIDS.reduce((a, b) => kidData(a.id).stats.weeklyXp >= kidData(b.id).stats.weeklyXp ? a : b);
      const streakKing = KIDS.reduce((a, b) => kidData(a.id).stats.streakDays >= kidData(b.id).stats.streakDays ? a : b);
      const challenges = nextChallengeTexts();
      document.getElementById("tab-league").innerHTML = `
        <section class="panel">
          <div class="panel-head"><h2>형제 리그</h2><span class="chip">서로 자극받는 성장 보드</span></div>
          <div class="panel-body">
            <div class="league-awards">
              <div class="award-card"><b>🎯</b>오늘의 미션왕<br>${missionKing.name}</div>
              <div class="award-card"><b>📈</b>이번 주 성장왕<br>${growthKing.name}</div>
              <div class="award-card"><b>🔥</b>연속 성공왕<br>${streakKing.name}</div>
            </div>
            <div class="challenge-box">
              <h3>다음 도전 목표</h3>
              ${challenges.map((text) => `<p>✨ ${text}</p>`).join("")}
            </div>
            <div class="grid-3">${KIDS.map((kid) => {
              const data = kidData(kid.id);
              const lvl = levelInfo(data.xp).current;
              const equipped = Object.values(data.equippedItems).filter(Boolean).map((id) => itemById(id)?.icon).filter(Boolean).join(" ");
              return `<div class="league-card" style="--kid-color:${kid.color}">
                <div class="card-top">${avatarMarkup(data, kid, "mini-avatar")}<span class="chip">레벨 ${lvl.level}</span></div>
                <h3 class="card-title">${kid.name} · ${data.nickname}</h3>
                <p class="card-sub">${className(kid.id)}</p>
                <p class="card-sub">대표 칭호: ${itemById(data.equippedItems.title)?.name || lvl.title}</p>
                <p class="card-sub">오늘 클리어 ${doneCount(kid.id)}개 · 이번 주 XP ${data.stats.weeklyXp} · 연속 ${data.stats.streakDays}일</p>
                <p class="card-sub">보유 배지: ${data.badges.length ? data.badges.join(", ") : "아직 없음"}</p>
                <p class="card-sub">착용 아이템: ${equipped || "기본 장비"}</p>
              </div>`;
            }).join("")}</div>
          </div>
        </section>`;
    }

    function renderShop() {
      const data = kidData();
      const lvl = levelInfo(data.xp).current.level;
      const nextTarget = DECOR_ITEMS.find((item) => !data.inventory.includes(item.id) && (lvl < item.level || data.coins < item.cost));
      document.getElementById("tab-shop").innerHTML = `
        <section class="panel">
          <div class="panel-head"><h2>상점</h2><span class="chip">${data.coins} 코인 보유</span></div>
          <div class="panel-body stack">
            <div class="panel" style="box-shadow:none;"><div class="panel-head"><h2>꾸미기 상점</h2><span class="chip">레벨 잠금 해제</span></div>
              <div class="panel-body grid-3">${DECOR_ITEMS.map((item) => {
                const state = shopState(item, data, lvl);
                const isTarget = nextTarget?.id === item.id;
                return `<div class="shop-card ${state.disabled ? "locked" : ""} ${isTarget ? "next-target" : ""}">
                  <div class="card-top"><span class="icon-box">${item.icon}</span><span class="chip">레벨 ${item.level}</span></div>
                  <span class="state-pill ${isTarget ? "target" : state.cls}">${isTarget ? "다음 목표" : state.text}</span>
                  <h3 class="card-title">${item.name}</h3>
                  <p class="card-sub">${typeName(item.type)} · 필요 레벨 ${item.level} · ${item.cost} 코인</p>
                  <p class="card-sub">${state.text}${lvl < item.level ? ` · ${item.level - lvl}레벨만 더!` : data.coins < item.cost && !data.inventory.includes(item.id) ? ` · 미션으로 코인을 모아봐!` : ""}</p>
                  <button class="btn" type="button" data-buy="${item.id}" ${state.disabled ? "disabled" : ""}>${state.button}</button>
                </div>`;
              }).join("")}</div>
            </div>
            <div class="panel" style="box-shadow:none;"><div class="panel-head"><h2>가족 보상 상점</h2><span class="chip">코인으로 교환</span></div>
              <div class="panel-body grid-2">${FAMILY_REWARDS.map((r) => `<div class="shop-card ${data.coins < r.cost ? "locked" : ""}">
                <div class="card-top"><span class="icon-box">${data.coins >= r.cost ? "🎁" : "🔒"}</span><span class="chip">${rarityName(r.rarity)}</span></div>
                <h3 class="card-title">${r.title}</h3>
                <p class="card-sub">${r.cost} 코인 필요</p>
                <button class="btn gold" type="button" data-family-reward="${r.id}" ${data.coins >= r.cost ? "" : "disabled"}>${data.coins >= r.cost ? "교환하기" : "코인이 부족해요"}</button>
              </div>`).join("")}</div>
            </div>
          </div>
        </section>`;
      document.querySelectorAll("[data-buy]").forEach((b) => b.addEventListener("click", () => buyDecorItem(b.dataset.buy)));
      document.querySelectorAll("[data-family-reward]").forEach((b) => b.addEventListener("click", () => useFamilyReward(b.dataset.familyReward)));
    }

    function renderInventory() {
      const data = kidData();
      const owned = data.inventory.map(itemById).filter(Boolean);
      document.getElementById("tab-inventory").innerHTML = `
        <section class="panel">
          <div class="panel-head"><h2>보관함</h2><span class="chip">${owned.length}개 보유</span></div>
          <div class="panel-body">
            ${owned.length ? `<div class="grid-3">${owned.map((item) => {
              const equipped = data.equippedItems[item.type] === item.id;
              return `<div class="inventory-card">
                <div class="card-top"><span class="icon-box">${item.icon}</span><span class="chip">${equipped ? "현재 착용 중" : typeName(item.type)}</span></div>
                <h3 class="card-title">${item.name}</h3>
                <p class="card-sub">내 캐릭터와 형제 리그에 반영됩니다.</p>
                ${equipped
                  ? `<span class="state-pill equipped">현재 착용 중</span>${item.type !== "avatar" && item.type !== "background" ? `<button class="btn alt" type="button" data-unequip="${item.type}">해제</button>` : `<p class="card-sub">기본으로 유지되는 필수 아이템입니다.</p>`}`
                  : `<button class="btn" type="button" data-equip="${item.id}">착용하기</button>`}
              </div>`;
            }).join("")}</div>` : `<div class="empty">아직 구매한 아이템이 없습니다. 상점에서 첫 아이템을 구매해보세요!</div>`}
          </div>
        </section>`;
      document.querySelectorAll("[data-equip]").forEach((b) => b.addEventListener("click", () => equipItem(b.dataset.equip)));
      document.querySelectorAll("[data-unequip]").forEach((b) => b.addEventListener("click", () => unequipItem(b.dataset.unequip)));
    }

    function typeName(type) {
      return { avatar: "아바타", frame: "프레임", background: "배경", pet: "펫", aura: "오라", title: "칭호", badge: "배지", head: "머리 장비" }[type] || type;
    }
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    function ideaStatusName(status) {
      return { pending: "검토 중", selected: "채택", rejected: "보류" }[status] || "검토 중";
    }
    function formatIdeaDate(value) {
      if (!value) return "날짜 없음";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "날짜 없음";
      return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, "0")}.${String(date.getDate()).padStart(2, "0")}`;
    }
    function rarityName(rarity) {
      return { COMMON: "일반", RARE: "희귀", EPIC: "영웅", LEGEND: "전설", MYTHIC: "신화" }[rarity] || rarity;
    }

    function shopState(item, data, level) {
      const owned = data.inventory.includes(item.id);
      const equipped = data.equippedItems[item.type] === item.id;
      if (equipped) return { text: "착용 중", cls: "equipped", button: "착용 중", disabled: true };
      if (owned) return { text: "보유 중", cls: "ready", button: "보유 중", disabled: true };
      if (level < item.level) return { text: `레벨 ${item.level} 필요`, cls: "target", button: "레벨이 부족해요", disabled: true };
      if (data.coins < item.cost) return { text: `코인 ${item.cost - data.coins}개 더`, cls: "lock", button: "코인이 부족해요", disabled: true };
      return { text: "구매 가능", cls: "ready", button: "구매하기", disabled: false };
    }

    function nextChallengeTexts() {
      const missionMax = Math.max(...KIDS.map((kid) => doneCount(kid.id)));
      const weekMax = Math.max(...KIDS.map((kid) => kidData(kid.id).stats.weeklyXp));
      const streakMax = Math.max(...KIDS.map((kid) => kidData(kid.id).stats.streakDays));
      const missionTarget = KIDS.find((kid) => doneCount(kid.id) < missionMax) || KIDS[0];
      const weekTarget = KIDS.find((kid) => kidData(kid.id).stats.weeklyXp < weekMax) || KIDS[1] || KIDS[0];
      const streakTarget = KIDS.find((kid) => kidData(kid.id).stats.streakDays <= streakMax) || KIDS[2] || KIDS[0];
      const missionNeed = Math.max(1, missionMax - doneCount(missionTarget.id) + 1);
      const weekNeed = Math.max(10, weekMax - kidData(weekTarget.id).stats.weeklyXp + 10);
      const streakNeed = kidData(streakTarget.id).stats.streakDays >= streakMax ? 1 : Math.max(1, streakMax - kidData(streakTarget.id).stats.streakDays + 1);
      return [
        `${missionTarget.name}이 오늘 미션 ${missionNeed}개만 더 클리어하면 오늘의 미션왕 도전!`,
        `${weekTarget.name}이 ${weekNeed} XP만 더 얻으면 이번 주 성장왕 찬스!`,
        `${streakTarget.name}이 하루만 더 성공하면 연속 성공왕 도전!`
      ];
    }

    function renderParent() {
      document.getElementById("tab-parent").innerHTML = `
        <section class="panel">
          <div class="panel-head"><h2>부모 비밀 메뉴</h2><button class="btn alt small" type="button" id="toggleParent">${parentOpen ? "비밀 메뉴 닫기" : "비밀 메뉴 열기"}</button></div>
          <div class="panel-body">
            ${!parentOpen ? `<p class="card-sub">아이들 게임 화면과 분리된 부모용 관리 메뉴입니다.</p>` : !parentUnlocked ? `
              <div class="parent-grid" style="grid-template-columns:1fr auto;">
                <div class="field"><label for="parentPassword">비밀번호</label><input id="parentPassword" type="password" inputmode="numeric" placeholder="비밀번호를 입력하세요"></div>
                <button class="btn" id="unlockParent" type="button">확인</button>
              </div>` : `
              <div class="parent-grid">
                <div class="field"><label>아이</label><select id="parentKid">${KIDS.map((kid) => `<option value="${kid.id}" ${kid.id === selectedKidId ? "selected" : ""}>${kid.name}</option>`).join("")}</select></div>
                <div class="field"><label>종류</label><select id="parentType"><option value="both">XP+코인 추가</option><option value="xp">XP 추가</option><option value="coins">코인 추가</option><option value="coinsSub">코인 차감</option></select></div>
                <div class="field"><label>수량</label><input id="parentAmount" type="number" min="1" placeholder="숫자 입력"></div>
                <div class="field"><label>메모</label><input id="parentReason" type="text" placeholder="예: 특별 칭찬"></div>
                <button class="btn" id="parentApply" type="button">적용</button>
                <button class="btn danger" id="resetAll" type="button">전체 초기화</button>
              </div>
              <div class="parent-actions">
                <button class="btn alt" id="resetToday" type="button">오늘 체크 상태만 초기화</button>
                <button class="btn alt" id="resetIdeas" type="button">아이디어 목록 초기화</button>
                <button class="btn alt" id="exportBackup" type="button">백업 파일 다운로드</button>
                <label class="btn alt" for="importBackup">백업 파일 불러오기</label>
                <input id="importBackup" type="file" accept="application/json,.json" hidden>
              </div>
              <div class="notice-board" style="margin-top:14px;">
                <h3>새 미션 아이디어 목록</h3>
                ${renderParentMissionIdeas()}
              </div>
              <div class="notice-board" style="margin-top:14px;">
                <h3>현재 업데이트 예고 문구</h3>
                <ul class="notice-list">${(state.gameMeta.updateNotices || UPDATE_NOTICES).map((notice) => `<li>${notice}</li>`).join("")}</ul>
              </div>`}
          </div>
        </section>`;
      bindParentEvents();
    }

    function renderParentMissionIdeas() {
      const ideas = state.gameMeta.missionIdeas || [];
      if (!ideas.length) {
        return `<div class="empty">아직 제출된 새 미션 아이디어가 없습니다.</div>`;
      }
      return `<div class="stack">
        ${ideas.map((idea) => `<div class="vote-card">
          <div class="card-top"><span class="icon-box">💡</span><span class="state-pill ${idea.status === "selected" ? "ready" : idea.status === "rejected" ? "lock" : "target"}">${ideaStatusName(idea.status)}</span></div>
          <h4 class="card-title">${escapeHtml(idea.text)}</h4>
          <p class="card-sub">작성: ${idea.kidName || kidConfig(idea.kidId).name} · ${formatIdeaDate(idea.createdAt)}</p>
          <label class="field">
            <span style="display:block;margin-bottom:6px;color:var(--muted);font-size:13px;font-weight:1000;">상태 변경</span>
            <select data-idea-status="${idea.id}">
              <option value="pending" ${idea.status === "pending" ? "selected" : ""}>검토 중</option>
              <option value="selected" ${idea.status === "selected" ? "selected" : ""}>채택</option>
              <option value="rejected" ${idea.status === "rejected" ? "selected" : ""}>보류</option>
            </select>
          </label>
        </div>`).join("")}
      </div>`;
    }

    function bindParentEvents() {
      document.getElementById("toggleParent")?.addEventListener("click", () => { parentOpen = !parentOpen; renderParent(); });
      document.getElementById("unlockParent")?.addEventListener("click", () => {
        if (document.getElementById("parentPassword").value === PARENT_PASSWORD) {
          parentUnlocked = true;
          renderParent();
          showToast("비밀 메뉴가 열렸습니다.");
        } else showToast("비밀번호가 맞지 않아요");
      });
      document.getElementById("parentApply")?.addEventListener("click", parentAdjust);
      document.getElementById("resetToday")?.addEventListener("click", resetTodayOnly);
      document.getElementById("resetIdeas")?.addEventListener("click", resetMissionIdeas);
      document.querySelectorAll("[data-idea-status]").forEach((select) => select.addEventListener("change", () => updateMissionIdeaStatus(select.dataset.ideaStatus, select.value)));
      document.getElementById("resetAll")?.addEventListener("click", resetAllData);
      document.getElementById("exportBackup")?.addEventListener("click", exportBackup);
      document.getElementById("importBackup")?.addEventListener("change", (e) => importBackup(e.target.files[0]));
    }

    function parentAdjust() {
      const id = document.getElementById("parentKid").value;
      const type = document.getElementById("parentType").value;
      const amount = Math.max(1, Math.floor(Number(document.getElementById("parentAmount").value || 0)));
      const reason = document.getElementById("parentReason").value.trim() || "부모 직접 조정";
      const data = kidData(id);
      if (type === "both") addXpCoins(id, amount, amount);
      if (type === "xp") addXpCoins(id, amount, 0);
      if (type === "coins") addXpCoins(id, 0, amount);
      if (type === "coinsSub") spendCoins(id, amount);
      addHistory(`${kidConfig(id).name}: ${reason} (${type}) ${amount}`);
      saveAndRender("부모 조정을 반영했습니다.");
    }

    function resetTodayOnly() {
      if (!confirm("오늘 체크 상태와 가족 보너스만 초기화할까요? XP와 코인은 유지됩니다.")) return;
      KIDS.forEach((kid) => { state.kids[kid.id].todayDone = {}; });
      state.familyBonuses = {};
      addHistory("부모 메뉴: 오늘 체크 상태 초기화");
      saveAndRender("오늘 체크 상태를 초기화했습니다.");
    }

    function resetAllData() {
      if (!confirm("전체 데이터를 모두 초기화할까요? 모든 XP, 코인, 아이템, 기록이 사라집니다.")) return;
      state = makeInitialState();
      selectedKidId = KIDS[0].id;
      activeTab = "character";
      parentOpen = false;
      parentUnlocked = false;
      saveAndRender("전체 데이터를 초기화했습니다.");
    }

    function exportBackup() {
      const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), storageKey: STORAGE_KEY, data: state }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `kids-point-game-backup-${getTodayKey()}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("백업 파일을 다운로드했습니다.");
    }

    function importBackup(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const imported = parsed.data || parsed;
          if (!imported || !imported.kids) throw new Error("Invalid backup");
          if (!confirm("백업 파일의 데이터로 현재 데이터를 바꿀까요?")) return;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(imported));
          state = loadState();
          render();
          showToast("백업 파일을 불러왔습니다.");
        } catch (error) {
          showToast("백업 파일을 읽을 수 없습니다.");
        }
      };
      reader.readAsText(file);
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      if (String(message).includes("<")) {
        els.toast.innerHTML = message;
      } else {
        els.toast.textContent = message;
      }
      els.toast.classList.add("show");
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1900);
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => btn.addEventListener("click", () => {
      activeTab = btn.dataset.tab;
      saveAndRender();
    }));

    render();
  </script>
</body>
</html>
