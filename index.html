    function unlockKid(kidId, pin) {
      if (!kidId) return false;
      const correct = state.gameMeta.kidPins?.[kidId] || "1111";
      if (String(pin).trim() !== String(correct)) return false;
      selectedKidId = kidId;
      unlockedKidId = kidId;
      selectedGateKid = null;
      kidGateActive = false;
      document.getElementById("kidGateOverlay")?.remove();
      saveState();
      render();
      setTimeout(() => showNextUnreadNotification(kidId), 300);
      return true;
    }
    function lockKidGate() {
      unlockedKidId = null;
      kidGateActive = true;
      selectedGateKid = null;
      renderKidGate();
    }
    function updateKidPins() {
      const inputs = document.querySelectorAll(".pin-change-input");
      if (!inputs.length) return;
      if (!state.gameMeta.kidPins) state.gameMeta.kidPins = {};
      inputs.forEach((inp) => {
        const v = inp.value.trim();
        if (v.length >= 1) state.gameMeta.kidPins[inp.dataset.pinKid] = v;
      });
      saveState();
      playSound("backup");
      showToast("🔐 아이별 비밀 코드를 저장했어요.");
    }

    /*
      ==============================
      v1.3-7: 개인방 권한 체계
      ==============================
    */
    function canEditKid(kidId = selectedKidId) {
      return unlockedKidId !== null && unlockedKidId === kidId;
    }
    function guardKidAction(kidId = selectedKidId) {
      if (canEditKid(kidId)) return true;
      const owner = displayName(kidId);
      const me = unlockedKidId ? displayName(unlockedKidId) : null;
      const msg = me
        ? `${me}으로 입장 중이에요. ${owner}의 방에서 ${owner}만 바꿀 수 있어요!`
        : "게이트에서 내 캐릭터로 입장해주세요.";
      showToast(msg);
      playSound("error");
      return false;
    }
    function getActiveKidLabel() {
      if (!unlockedKidId) return `${displayName(selectedKidId)} 출전 중`;
      if (unlockedKidId === selectedKidId) return `${displayName(selectedKidId)} 출전 중 🎮`;
      return `${displayName(selectedKidId)} 구경 중 👀`;
    }
    function renderViewModeNotice(kidId = selectedKidId) {
      if (canEditKid(kidId)) return "";
      const owner = displayName(kidId);
      const me = unlockedKidId ? displayName(unlockedKidId) : null;
      const msg = me
        ? `${me}으로 입장 중 · ${owner}의 방은 구경만 할 수 있어요`
        : "게이트에서 입장 후 이용할 수 있어요";
      return `<div class="view-mode-badge">👀 ${msg}</div>`;
    }

    /*
      ==============================
      v1.3-7: 시험 보너스 시스템
      ==============================
    */
    const EXAM_REWARDS = {
      "90+": { xp: 30, coins: 30, label: "90점 이상" },
      "100": { xp: 50, coins: 50, label: "100점 완벽!" }
    };
    function isDuplicateExamBonus(subject, scoreType) {
      const today = getTodayKey();
      const relevant = (state.pendingApprovals || []).filter((a) =>
        a.approvalType === "exam_bonus" &&
        a.kidId === selectedKidId &&
        a.subject === subject &&
        a.date === today &&
        a.status !== "rejected"
      );
      if (relevant.some((a) => a.scoreType === scoreType)) return "이미 같은 과목·점수로 요청했어요.";
      if (scoreType === "90+" && relevant.some((a) => a.scoreType === "100")) {
        return `${subject} 100점 요청이 이미 있어요. 추가 요청은 필요 없어요!`;
      }
      return null;
    }
    function requestExamBonus() {
      if (!guardKidAction()) return;
      const subject = document.getElementById("examSubjectSel")?.value;
      const scoreType = document.getElementById("examScoreSel")?.value;
      if (!subject || !scoreType) return;
      const dup = isDuplicateExamBonus(subject, scoreType);
      if (dup) { showToast(dup); playSound("error"); return; }
      const reward = EXAM_REWARDS[scoreType];
      if (!reward) return;
      if (!Array.isArray(state.pendingApprovals)) state.pendingApprovals = [];
      state.pendingApprovals.push({
        id: `appr_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        kidId: selectedKidId,
        questId: null,
        questTitle: `시험 보너스: ${subject} ${reward.label}`,
        xp: reward.xp,
        coins: reward.coins,
        requestedAt: new Date().toISOString(),
        status: "pending",
        approvalType: "exam_bonus",
        subject,
        scoreType,
        date: getTodayKey()
      });
      addHistory(`${displayName(selectedKidId)}가 ${subject} 시험 보너스를 요청했어요: ${reward.label}`);
      playSound("click");
      saveAndRender(`<strong>🎓 시험 보너스 요청!</strong><span>${subject} ${reward.label} 요청을 보냈어요 🙏</span>`);
    }
    function renderExamBonusForm() {
      if (!canEditKid(selectedKidId)) return "";
      const today = getTodayKey();
      const myPending = (state.pendingApprovals || []).filter((a) =>
        a.approvalType === "exam_bonus" && a.kidId === selectedKidId &&
        a.date === today && a.status === "pending"
      );
      const subjects = ["국어", "수학", "사회", "과학", "영어", "기타"];
      return `<div class="exam-bonus-form">
        <h3>🎓 시험 보너스 요청</h3>
        <p>시험을 잘 봤나요? 부모님께 확인 요청을 보내봐요!</p>
        <div class="grid-2" style="gap:10px;">
          <div class="field"><label for="examSubjectSel">과목</label>
            <select id="examSubjectSel">${subjects.map((s) => `<option value="${s}">${s}</option>`).join("")}</select>
          </div>
          <div class="field"><label for="examScoreSel">점수</label>
            <select id="examScoreSel">
              <option value="90+">90점 이상 (+30 XP / +30 코인)</option>
              <option value="100">100점 완벽! (+50 XP / +50 코인)</option>
            </select>
          </div>
        </div>
        <button class="btn gold" id="examBonusReqBtn" type="button" style="margin-top:10px;">🎓 시험 보너스 요청하기</button>
        ${myPending.length ? `<div class="stack" style="margin-top:10px;">${myPending.map((a) => `<div class="approval-card">
          <div class="card-top"><span class="icon-box">📝</span><span class="chip">${a.subject} ${a.scoreType === "100" ? "100점" : "90점 이상"}</span></div>
          <p class="card-sub" style="margin:0;">+${a.xp} XP / +${a.coins} 코인 · ⏳ 부모 확인 중</p>
        </div>`).join("")}</div>` : ""}
      </div>`;
    }

    function completeQuest(questId) {
      if (!guardKidAction()) return;
      const quest = QUESTS.find((q) => q.id === questId);
      const data = kidData();
      if (!quest || data.todayDone[questId]) return;
      const beforeLevel = levelInfo(data.xp).current.level;
      data.todayDone[questId] = true;
      addXpCoins(selectedKidId, quest.xp, quest.coins);
      trackSeasonProgress(selectedKidId, questId, 1);
      syncBadges(selectedKidId);
      const afterLevel = levelInfo(data.xp).current.level;
      addHistory(`${displayName(selectedKidId)}가 ${quest.title} 미션 클리어! +${quest.xp} XP / +${quest.coins} 코인`);
      const remain = levelInfo(data.xp).remain;
      const extra = afterLevel > beforeLevel
        ? `레벨업! 레벨 ${afterLevel} 새 아이템을 확인해봐!`
        : remain === 0
          ? "최고 레벨 도전 완료!"
          : `좋아! 다음 레벨까지 ${remain} XP!`;
      if (afterLevel > beforeLevel) playSound("levelup"); else playSound("clear");
      showFloatingReward(`+${quest.xp} XP / +${quest.coins} 코인`);
      saveAndRender(`<strong>미션 클리어! +${quest.xp} XP / +${quest.coins} 코인</strong><span>${extra}</span>`);
    }

    function undoQuest(questId) {
      if (!guardKidAction()) return;
      const quest = QUESTS.find((q) => q.id === questId);
      const data = kidData();
      if (!quest || !data.todayDone[questId]) return;
      delete data.todayDone[questId];
      data.coins = Math.max(0, data.coins - quest.coins);
      data.xp = Math.max(0, data.xp - quest.xp);
      data.stats.weeklyXp = Math.max(0, data.stats.weeklyXp - quest.xp);
      trackSeasonProgress(selectedKidId, questId, -1);
      addHistory(`${displayName(selectedKidId)}: ${quest.title} 미션 되돌리기 -${quest.xp} XP / -${quest.coins} 코인`);
      playSound("undo");
      saveAndRender("<strong>미션을 되돌렸어요</strong><span>XP와 코인을 원래대로 조정했습니다.</span>");
    }

    function claimFamilyMission(id) {
      const mission = FAMILY_MISSIONS.find((m) => m.id === id);
      if (!mission || state.familyBonuses[id]) return;
      if (!KIDS.every((kid) => doneCount(kid.id) >= mission.required)) return;
      KIDS.forEach((kid) => { addXpCoins(kid.id, mission.bonusXp, mission.bonusCoins); syncBadges(kid.id); });
      state.familyBonuses[id] = true;
      addHistory(`팀 미션 클리어! 모두에게 +${mission.bonusXp} XP / +${mission.bonusCoins} 코인`);
      saveAndRender(`팀 보너스 +${mission.bonusXp} XP / +${mission.bonusCoins} 코인`);
    }

    function claimSeasonReward(challengeId) {
      if (!guardKidAction()) return;
      const challenge = SEASON_CHALLENGES.find((c) => c.id === challengeId);
      if (!challenge) return;
      const progress = getSeasonProgress(selectedKidId, challenge);
      if (progress < challenge.target || hasSeasonClaim(selectedKidId, challenge.id)) return;
      state.seasonClaims = state.seasonClaims || {};
      state.seasonClaims[seasonKey(challenge.id, selectedKidId)] = true;
      state.seasonBadges[selectedKidId] = state.seasonBadges[selectedKidId] || [];
      if (!state.seasonBadges[selectedKidId].some((b) => b.id === challenge.id && b.monthKey === getMonthKey())) {
        state.seasonBadges[selectedKidId].push({
          id: challenge.id,
          name: challenge.badge,
          monthKey: getMonthKey(),
          earnedAt: new Date().toISOString()
        });
      }
      if (challenge.badge && !kidData(selectedKidId).badges.includes(challenge.badge)) kidData(selectedKidId).badges.push(challenge.badge);
      addXpCoins(selectedKidId, challenge.xp, challenge.coins);
      if (challenge.teamMedals) state.gameMeta.teamMedals = (state.gameMeta.teamMedals || 0) + challenge.teamMedals;
      addHistory(`${displayName(selectedKidId)}가 시즌 보상을 받았어요: ${challenge.badge} +${challenge.xp} XP / +${challenge.coins} 코인${challenge.teamMedals ? ` / 팀 메달 +${challenge.teamMedals}` : ""}`);
      addNotification(selectedKidId, "season_claim", "🏅 시즌 보상 획득!", `${challenge.title} 완료!`, `${challenge.badge}`);
      playSound("levelup");
      showFloatingReward(`${challenge.badge} 획득!`);
      saveAndRender(`<strong>🏅 시즌 보상 획득!</strong><span>${challenge.badge}</span>`);
    }

    function buyDecorItem(id) {
      if (!guardKidAction()) return;
      const item = itemById(id);
      const data = kidData();
      const lvl = levelInfo(data.xp).current.level;
      if (!item || data.inventory.includes(id) || lvl < item.level || data.coins < item.cost) return;
      if (!confirm(`${item.name}을 ${item.cost} 코인으로 구매할까요?`)) return;
      spendCoins(selectedKidId, item.cost);
      data.inventory.push(id);
      addHistory(`${displayName(selectedKidId)}이 꾸미기 아이템 구매! ${item.name} -${item.cost} 코인`);
      playSound("purchase");
      saveAndRender(`${item.name} 구매 완료! 보관함에서 착용하세요.`);
    }

    function requestFamilyReward(id) {
      if (!guardKidAction()) return;
      const reward = FAMILY_REWARDS.find((r) => r.id === id);
      const can = canRequestReward(selectedKidId, id);
      if (!reward || !can.ok) { playSound("error"); showToast(can.reason); return; }
      const request = {
        id: `reward_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        approvalType: "family_reward",
        kidId: selectedKidId,
        rewardId: reward.id,
        rewardName: reward.title,
        cost: reward.cost,
        requestedAt: new Date().toISOString(),
        status: "pending"
      };
      state.pendingApprovals.push(request);
      state.rewardRequests = state.rewardRequests || [];
      state.rewardRequests.push(request);
      addHistory(`${displayName(selectedKidId)}가 가족 보상을 요청했어요: ${reward.title}`);
      addNotification(selectedKidId, "reward_pending", "🎁 가족 보상 요청 완료!", "부모 승인 대기 중이에요.", reward.title);
      playSound("click");
      saveAndRender(`<strong>🎁 가족 보상 요청 완료!</strong><span>${reward.title} · 부모 승인 대기 중이에요.</span>`);
    }

    function joinCoopReward(id) {
      if (!guardKidAction()) return;
      const reward = COOP_REWARDS.find((r) => r.id === id);
      if (!reward) return;
      const can = canRequestCoopReward(id);
      if (!can.ok && !can.reason.includes("참여")) { playSound("error"); showToast(can.reason); return; }
      state.coopRewardJoins[id] = state.coopRewardJoins[id] || {};
      state.coopRewardJoins[id][selectedKidId] = true;
      addHistory(`${displayName(selectedKidId)}가 형제 협동 보상에 참여했어요: ${reward.title}`);
      const joinedIds = Object.keys(state.coopRewardJoins[id]).filter((kidId) => state.coopRewardJoins[id][kidId]);
      if (KIDS.every((kid) => joinedIds.includes(kid.id)) && !pendingApprovalFor("coop_reward", id)) {
        const finalCheck = canRequestCoopReward(id);
        if (finalCheck.ok) {
          const request = {
            id: `coop_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            approvalType: "coop_reward",
            rewardId: reward.id,
            rewardName: reward.title,
            kidIds: KIDS.map((kid) => kid.id),
            totalCost: reward.totalCost,
            perKidCost: reward.perKidCost,
            teamMedalCost: reward.teamMedals,
            requestedAt: new Date().toISOString(),
            status: "pending"
          };
          state.pendingApprovals.push(request);
          state.coopRewardRequests = state.coopRewardRequests || [];
          state.coopRewardRequests.push(request);
          KIDS.forEach((kid) => addNotification(kid.id, "coop_reward_pending", "🤝 협동 보상 요청 완료!", `${reward.title} 부모 승인 대기 중이에요.`, "3형제 참여 완료"));
          addHistory(`3형제가 협동 보상 승인을 요청했어요: ${reward.title}`);
        }
      }
      playSound("click");
      saveAndRender(`<strong>🤝 참여 완료!</strong><span>${reward.title} 협동 보상에 참여했어요.</span>`);
    }

    function approveFamilyReward(appr) {
      const reward = FAMILY_REWARDS.find((r) => r.id === appr.rewardId);
      const can = canRequestReward(appr.kidId, appr.rewardId, { ignorePending: true });
      if (!reward || !can.ok) { showToast(can.reason); return; }
      appr.status = "approved";
      spendCoins(appr.kidId, reward.cost);
      recordRewardUsage(appr.kidId, reward.id);
      state.rewardRequests = (state.rewardRequests || []).map((r) => r.id === appr.id ? { ...r, status: "approved" } : r);
      addHistory(`부모가 ${displayName(appr.kidId)}의 가족 보상을 승인했어요: ${reward.title} -${reward.cost} 코인`);
      addNotification(appr.kidId, "reward_approved", "🎉 가족 보상 승인!", `${reward.title}을 사용할 수 있어요.`, `-${reward.cost} 코인`);
      playSound("approval");
      saveAndRender(`<strong>🎉 가족 보상 승인!</strong><span>${displayName(appr.kidId)} · ${reward.title}</span>`);
    }

    function approveCoopReward(appr) {
      const reward = COOP_REWARDS.find((r) => r.id === appr.rewardId);
      const can = canRequestCoopReward(appr.rewardId, { ignorePending: true });
      if (!reward || !can.ok) { showToast(can.reason); return; }
      appr.status = "approved";
      KIDS.forEach((kid) => spendCoins(kid.id, reward.perKidCost));
      state.gameMeta.teamMedals = Math.max(0, (state.gameMeta.teamMedals || 0) - reward.teamMedals);
      recordCoopRewardUsage(reward.id);
      state.coopRewardJoins[reward.id] = {};
      state.coopRewardRequests = (state.coopRewardRequests || []).map((r) => r.id === appr.id ? { ...r, status: "approved" } : r);
      addHistory(`부모가 형제 협동 보상을 승인했어요: ${reward.title} · 각 ${reward.perKidCost} 코인 · 팀 메달 ${reward.teamMedals}개`);
      KIDS.forEach((kid) => addNotification(kid.id, "coop_reward_approved", "🎉 협동 보상 승인!", `${reward.title}을 함께 사용할 수 있어요.`, `팀 보상 열림`));
      playSound("approval");
      saveAndRender(`<strong>🎉 협동 보상 승인!</strong><span>${reward.title} · 팀 메달과 코인이 차감됐어요.</span>`);
    }

    function equipItem(id) {
      if (!guardKidAction()) return;
      const item = itemById(id);
      const data = kidData();
      if (!item || !data.inventory.includes(id)) return;
      const slot = itemSlot(item);
      data.equippedItems[slot] = id;
      if (slot === "skin") data.equippedItems.avatar = id;
      if (slot === "headgear") data.equippedItems.head = id;
      if (slot === "badge" && !data.badges.includes(item.name)) data.badges.push(item.name);
      playSound("equip");
      saveAndRender(`${item.name} 장착 완료`);
    }

    function unequipItem(type) {
      if (!guardKidAction()) return;
      const data = kidData();
      if (type === "skin" || type === "avatar" || type === "background" || type === "frame" || type === "title") return;
      data.equippedItems[type] = null;
      if (type === "headgear") data.equippedItems.head = null;
      saveAndRender("장착을 해제했습니다.");
    }

    function submitMissionIdea() {
      if (!guardKidAction()) return;
      const input = document.getElementById("missionIdeaInput");
      if (!input) return;
      const text = input.value.trim().replace(/\s+/g, " ");
      if (text.length < 3) {
        showToast("아이디어를 3글자 이상 적어주세요.");
        return;
      }
      if (text.length > 60) {
        showToast("아이디어는 60글자 안으로 짧게 적어주세요.");
        return;
      }
      const ideas = state.gameMeta.missionIdeas || [];
      const duplicated = ideas.some((idea) => idea.kidId === selectedKidId && idea.text === text);
      if (duplicated) {
        showToast("이미 저장된 아이디어예요. 새로운 아이디어를 적어보세요!");
        return;
      }
      const kid = kidConfig(selectedKidId);
      ideas.unshift({
        id: `idea_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        kidId: selectedKidId,
        kidName: displayName(selectedKidId),
        text,
        createdAt: new Date().toISOString(),
        status: "pending"
      });
      state.gameMeta.missionIdeas = ideas.slice(0, 50);
      input.value = "";
      addHistory(`${displayName(selectedKidId)}: 새 미션 아이디어 제출 - ${text}`);
      saveAndRender("좋은 아이디어예요! 다음 업데이트 후보에 저장됐어요.");
    }

    function updateMissionIdeaStatus(id, status) {
      const idea = state.gameMeta.missionIdeas.find((item) => item.id === id);
      if (!idea) return;
      idea.status = status;
      saveAndRender("아이디어 상태를 바꿨습니다.");
    }

    function resetMissionIdeas() {
      if (!confirm("새 미션 아이디어 목록을 초기화할까요?")) return;
      state.gameMeta.missionIdeas = [];
      addHistory("부모 메뉴: 새 미션 아이디어 목록 초기화");
      saveAndRender("새 미션 아이디어 목록을 초기화했습니다.");
    }

    function setTeamPhotoBackground(id) {
      if (!PHOTO_BACKGROUNDS.some((bg) => bg.id === id)) return;
      state.gameMeta.teamPhotoBackground = id;
      saveAndRender();
    }

    function openCharacterSettings() {
      if (!guardKidAction()) return;
      const data = kidData();
      selectedSettingsAvatar = data.avatar || kidConfig(selectedKidId).avatar;
      settingsModalOpen = true;
      renderSettingsModal();
    }

    function closeCharacterSettings() {
      settingsModalOpen = false;
      renderSettingsModal();
    }

    function saveCharacterSettings() {
      if (!guardKidAction()) return;
      const data = kidData();
      const kid = kidConfig(selectedKidId);
      const input = document.getElementById("settingsNickname");
      const cleanName = input?.value.trim();
      data.nickname = cleanName ? cleanName.slice(0, 16) : "";
      if (selectedSettingsAvatar) {
        data.avatar = selectedSettingsAvatar.slice(0, 4);
        if (isDefaultSkin(data.equippedItems.skin)) {
          data.equippedItems.skin = "basic_avatar";
          data.equippedItems.avatar = "basic_avatar";
        }
        if (!data.inventory.includes("basic_avatar")) data.inventory.push("basic_avatar");
      }
      addHistory(`${displayName(selectedKidId)}: 캐릭터 설정 변경`);
      settingsModalOpen = false;

    function renderMissions() {

        const min = Math.min(...KIDS.map((kid) => doneCount(kid.id)));

        const claimed = state.familyBonuses[m.id];
        return `<div class="team-card">
          <div class="card-top"><h3 class="card-title">${m.id === "all_5" ? "슈퍼 보너스" : "팀 보너스"}</h3><span class="chip">+${m.bonusXp} XP / +${m.bonusCoins} 코인</span></div>

          <div class="xp-bar"><span style="width:${Math.min(100, min / m.required * 100)}%"></span></div>
          <button class="btn gold" type="button" data-family="${m.id}" ${ready && !claimed ? "" : "disabled"}>${claimed ? "수령 완료" : ready ? "팀 보상 받기" : "조건 미달"}</button>
        </div>`;
      }).join("");
      const isOwner = canEditKid(selectedKidId);
      document.getElementById("tab-missions").innerHTML = `
        <section class="panel">
          <div class="panel-head"><h2>오늘 미션</h2><span class="chip">${getActiveKidLabel()}</span></div>

              const clear = data.todayDone[q.id];
              const pending = q.requiresApproval && hasPendingApproval(q.id);
              const chipText = clear ? "클리어 완료" : pending ? "확인 기다리는 중" : "도전";
              let btnHtml;
              if (!isOwner) {
                btnHtml = clear
                  ? `<span class="state-pill ready">클리어 완료 ✓</span>`
                  : `<span class="owner-only-note">👀 구경 모드</span>`;
              } else if (clear) {
                btnHtml = `<button class="btn alt" type="button" data-undo="${q.id}">되돌리기</button>`;
              } else if (pending) {
                btnHtml = `<button class="btn alt" type="button" disabled>⏳ 부모 확인 중</button>`;
              } else if (q.requiresApproval) {
                btnHtml = `<button class="btn gold" type="button" data-request="${q.id}">✋ 완료 요청</button>`;
              } else {
                btnHtml = `<button class="btn" type="button" data-clear="${q.id}">클리어!</button>`;
              }
              return `<div class="mission-card ${clear ? "clear" : ""}">
                <div class="card-top"><span class="icon-box">${q.icon}</span><span class="chip">${chipText}</span></div>
                <h3 class="card-title">${q.title}</h3>
                <p class="card-sub"><span class="reward-line">+${q.xp} XP / +${q.coins} 코인</span> · ${q.requiresApproval ? "⭐ 부모 승인 필요" : "하루 1회"}</p>
                ${btnHtml}
              </div>`;
            }).join("")}</div>

    function typeName(type) {
      return { skin: "스킨", avatar: "스킨", weapon: "무기", headgear: "머리 장비", head: "머리 장비", frame: "프레임", background: "배경", pet: "펫", aura: "오라", title: "칭호", badge: "배지" }[type] || type;
    }
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    function ideaStatusName(status) {
      return { pending: "검토 중", selected: "채택", rejected: "보류" }[status] || "검토 중";
    }
    function formatIdeaDate(value) {
      if (!value) return "날짜 없음";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "날짜 없음";
      return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, "0")}.${String(date.getDate()).padStart(2, "0")}`;
    }
    function rarityName(rarity) {
      return { COMMON: "일반", RARE: "희귀", EPIC: "영웅", LEGEND: "전설", MYTHIC: "신화" }[rarity] || rarity;
    }
    function rarityClass(item) {
      const rarity = item?.rarity || "일반";
      return {
        "일반": "rarity-common",
        "희귀": "rarity-rare",
        "에픽": "rarity-epic",
        "전설": "rarity-legend",
        "신화": "rarity-mythic"
      }[rarity] || "rarity-common";
    }
    function evolutionName(kidId, level) {
      const table = {
        jinwoo: [[8, "전설의 수호자"], [5, "수호 기사"], [3, "강철 방패 용사"], [1, "방패 용사"]],
        jinyoung: [[8, "전설의 스피드왕"], [5, "번개 히어로"], [3, "스피드 챌린저"], [1, "번개 러너"]],
        jinhwan: [[8, "전설의 불꽃왕"], [5, "화염 히어로"], [3, "불꽃 챌린저"], [1, "불꽃 파이터"]]
      };
      return (table[kidId] || table.jinwoo).find(([min]) => level >= min)?.[1] || "미션 플레이어";
    }
    function nextEvolution(kidId, level) {
      const table = {
        jinwoo: [[3, "강철 방패 용사"], [5, "수호 기사"], [8, "전설의 수호자"]],
        jinyoung: [[3, "스피드 챌린저"], [5, "번개 히어로"], [8, "전설의 스피드왕"]],
        jinhwan: [[3, "불꽃 챌린저"], [5, "화염 히어로"], [8, "전설의 불꽃왕"]]
      };
      return (table[kidId] || []).find(([min]) => level < min) || null;
    }

    function shopState(item, data, level) {
      const owned = data.inventory.includes(item.id);
      const slot = itemSlot(item);
      const equipped = data.equippedItems[slot] === item.id;
      if (equipped) return { text: "장착 중", cls: "equipped", button: "장착 중", disabled: true };
      if (owned) return { text: "보유 중", cls: "ready", button: "보유 중", disabled: true };
      if (level < item.level) return { text: `레벨 ${item.level} 필요`, cls: "target", button: "레벨이 부족해요", disabled: true };
      if (data.coins < item.cost) return { text: `코인 ${item.cost - data.coins}개 더`, cls: "lock", button: "코인이 부족해요", disabled: true };
      return { text: "구매 가능", cls: "ready", button: "구매하기", disabled: false };
    }
    function nextTargetItem(data, level) {
      return DECOR_ITEMS
        .filter((item) => !data.inventory.includes(item.id))
        .sort((a, b) => {
          const aGap = Math.max(0, a.level - level) * 1000 + Math.max(0, a.cost - data.coins);
          const bGap = Math.max(0, b.level - level) * 1000 + Math.max(0, b.cost - data.coins);
          return aGap - bGap;
        })[0] || null;
    }

    function nextChallengeTexts() {
      const missionMax = Math.max(...KIDS.map((kid) => doneCount(kid.id)));
      const weekMax = Math.max(...KIDS.map((kid) => kidData(kid.id).stats.weeklyXp));
      const streakMax = Math.max(...KIDS.map((kid) => kidData(kid.id).stats.streakDays));
      const missionTarget = KIDS.find((kid) => doneCount(kid.id) < missionMax) || KIDS[0];
      const weekTarget = KIDS.find((kid) => kidData(kid.id).stats.weeklyXp < weekMax) || KIDS[1] || KIDS[0];
      const streakTarget = KIDS.find((kid) => kidData(kid.id).stats.streakDays <= streakMax) || KIDS[2] || KIDS[0];
      const missionNeed = Math.max(1, missionMax - doneCount(missionTarget.id) + 1);
      const weekNeed = Math.max(10, weekMax - kidData(weekTarget.id).stats.weeklyXp + 10);
      const streakNeed = kidData(streakTarget.id).stats.streakDays >= streakMax ? 1 : Math.max(1, streakMax - kidData(streakTarget.id).stats.streakDays + 1);
      return [
        `${displayName(missionTarget.id)}이 오늘 미션 ${missionNeed}개만 더 클리어하면 오늘의 미션왕 도전!`,
        `${displayName(weekTarget.id)}이 ${weekNeed} XP만 더 얻으면 이번 주 성장왕 찬스!`,
        `${displayName(streakTarget.id)}이 하루만 더 성공하면 연속 성공왕 도전!`
      ];
    }

    function estimatePeriodReport(period = "week") {
      const now = new Date();
      const days = period === "week" ? getWeekProgressDays(now) : now.getDate();
      const possible = Math.max(1, QUESTS.length * days);
      return KIDS.map((kid) => {
        const data = kidData(kid.id);
        const today = Object.keys(data.todayDone || {}).length;
        const xpEstimate = Math.round((period === "week" ? data.stats.weeklyXp : data.xp / Math.max(1, now.getMonth() + 1)) / 12);
        const completed = Math.min(possible, Math.max(today, xpEstimate));
        const rate = Math.min(100, Math.round(completed / possible * 100));
        const study = Object.keys(data.todayDone || {}).filter((id) => id.startsWith("study_")).length;
        const hygiene = Object.keys(data.todayDone || {}).filter((id) => id === "fresh_feet" || id === "fresh_shower").length;
        return { kidId: kid.id, completed, possible, rate, study, hygiene, chests: state.dailyChests?.[kid.id] ? 1 : 0 };
      });
    }

    function teamMedalEstimate(reports) {
      if (reports.every((r) => r.rate >= 90)) return 2;
      if (reports.every((r) => r.rate >= 70)) return 1;
      return 0;
    }

    function renderWeeklyClosingPanel() {
      const key = getWeekKey();
      const closed = state.weeklyClosings?.[key];
      const reports = closed?.reports || estimatePeriodReport("week");
      const medal = closed?.teamMedals || teamMedalEstimate(reports);
      return `<div class="notice-board">
        <h3>⑧ 주간 마감</h3>
        <p class="card-sub">이번 주: ${key} · 팀 메달 예상 ${medal}개 · 현재 팀 메달 ${state.gameMeta.teamMedals || 0}개</p>
        <div class="grid-3" style="margin-top:10px;">${reports.map((r) => `<div class="team-card">
          <h4 class="card-title">${displayName(r.kidId)}</h4>
          <p class="card-sub">완료 ${r.completed}/${r.possible} · ${r.rate}%</p>
          <p class="card-sub">학습 ${r.study}회 · 위생 ${r.hygiene}회 · 보물상자 ${r.chests}회</p>
          <div class="xp-bar"><span style="width:${r.rate}%"></span></div>
        </div>`).join("")}</div>
        <button class="btn gold" id="weeklyCloseBtn" type="button" ${closed ? "disabled" : ""}>${closed ? "이번 주는 이미 마감했어요" : "이번 주 마감하기"}</button>
      </div>`;
    }

    function renderMonthlyClosingPanel() {
      const key = getMonthKey();
      const closed = state.monthlyClosings?.[key];
      const reports = closed?.reports || estimatePeriodReport("month");
      const teamMedals = closed?.teamMedals || (reports.every((r) => r.rate >= 90) ? 4 : reports.every((r) => r.rate >= 70) ? 2 : 0);
      return `<div class="notice-board">
        <h3>⑨ 월간 마감</h3>
        <p class="card-sub">이번 달: ${key} · 팀 메달 예상 ${teamMedals}개 · 시즌 배지와 한정 프레임은 월간 성장 보상이에요.</p>
        <div class="grid-3" style="margin-top:10px;">${reports.map((r) => `<div class="team-card">
          <h4 class="card-title">${displayName(r.kidId)}</h4>
          <p class="card-sub">월간 완료 ${r.completed}/${r.possible} · ${r.rate}%</p>
          <p class="card-sub">획득 시즌 보상: ${(state.seasonBadges?.[r.kidId] || []).filter((b) => b.monthKey === key).length}개</p>
          <div class="xp-bar"><span style="width:${r.rate}%"></span></div>
        </div>`).join("")}</div>
        <button class="btn gold" id="monthlyCloseBtn" type="button" ${closed ? "disabled" : ""}>${closed ? "이번 달은 이미 마감했어요" : "이번 달 마감하기"}</button>
      </div>`;
    }

    function closeCurrentWeek() {
      const key = getWeekKey();
      if (state.weeklyClosings?.[key]) return;
      const reports = estimatePeriodReport("week");
      reports.forEach((r) => {
        const coins = r.rate >= 90 ? 100 : r.rate >= 70 ? 50 : 0;
        if (!coins) return;
        addXpCoins(r.kidId, 0, coins);
        addNotification(r.kidId, "weekly_close", r.rate >= 90 ? "✨ 주간 빛나는 상자!" : "🎁 주간 작은 상자!", "이번 주도 멋지게 성장했어요!", `+${coins} 코인`);
        addHistory(`${displayName(r.kidId)} 주간 마감 보상 +${coins} 코인`);
      });
      const medals = teamMedalEstimate(reports);
      if (medals) {
        state.gameMeta.teamMedals = (state.gameMeta.teamMedals || 0) + medals;
        addHistory(`주간 마감 팀 메달 +${medals}`);
      }
      state.weeklyClosings[key] = { closedAt: new Date().toISOString(), reports, teamMedals: medals };
      playSound("approval");
      saveAndRender(`<strong>주간 마감 완료!</strong><span>팀 메달 +${medals}</span>`);
    }

    function closeCurrentMonth() {
      const key = getMonthKey();
      if (state.monthlyClosings?.[key]) return;
      const reports = estimatePeriodReport("month");
      const medals = reports.every((r) => r.rate >= 90) ? 4 : reports.every((r) => r.rate >= 70) ? 2 : 0;
      reports.forEach((r) => {
        if (r.rate < 70) return;
        const badgeName = r.rate >= 90 ? `${key} 시즌 한정 프레임` : `${key} 시즌 배지`;
        state.seasonBadges[r.kidId] = state.seasonBadges[r.kidId] || [];
        if (!state.seasonBadges[r.kidId].some((b) => b.name === badgeName && b.monthKey === key)) {
          state.seasonBadges[r.kidId].push({ id: `monthly_${key}_${r.rate >= 90 ? "frame" : "badge"}`, name: badgeName, monthKey: key, earnedAt: new Date().toISOString() });
        }
        if (!kidData(r.kidId).badges.includes(badgeName)) kidData(r.kidId).badges.push(badgeName);
        addNotification(r.kidId, "monthly_close", "🏅 월간 시즌 보상!", "이번 달 성장 보상을 얻었어요.", badgeName);
        addHistory(`${displayName(r.kidId)} 월간 마감 보상 획득: ${badgeName}`);
      });
      if (medals) {
        state.gameMeta.teamMedals = (state.gameMeta.teamMedals || 0) + medals;
        addHistory(`월간 마감 팀 메달 +${medals}`);
      }
      state.monthlyClosings[key] = { closedAt: new Date().toISOString(), reports, teamMedals: medals };
      playSound("approval");
      saveAndRender(`<strong>월간 마감 완료!</strong><span>팀 메달 +${medals}</span>`);
    }

    function renderBackupStatus() {
      const last = state.gameMeta.lastBackupAt;
      if (!last) {
        return `<div class="backup-warn">⚠️ 아직 백업한 적이 없어요. 백업 파일을 저장해 주세요!</div>`;
      }
      const d = new Date(last);
      const days = Math.floor((Date.now() - d.getTime()) / 86400000);
      const dateStr = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
      if (days >= 7) {
        return `<div class="backup-warn">⚠️ 마지막 백업: ${dateStr} (${days}일 전) — 7일 이상 백업하지 않았어요!<br><small>데이터를 안전하게 보관하려면 주 1회 백업을 권장합니다.</small></div>`;
      }
      return `<div class="backup-ok">✓ 최근 백업: ${dateStr} (${days === 0 ? "오늘" : days + "일 전"})</div>`;
    }

    function renderPendingApprovals() {
      const pending = (state.pendingApprovals || []).filter((a) => a.status === "pending");
      if (!pending.length) {
        return `<div class="empty">현재 승인 대기 중인 미션이 없습니다.</div>`;
      }
      return `<div class="stack">${pending.map((a) => {
        const isExam = a.approvalType === "exam_bonus";
        const isFamilyReward = a.approvalType === "family_reward";
        const isCoopReward = a.approvalType === "coop_reward";
        const t = new Date(a.requestedAt || a.createdAt || Date.now());
        const timeStr = `${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`;
        const typeLabel = isCoopReward
          ? `🤝 형제 협동 보상 · 각 ${a.perKidCost} 코인 · 팀 메달 ${a.teamMedalCost}개`
          : isFamilyReward
            ? `🎁 개인 가족 보상 · ${a.cost} 코인`
            : isExam
              ? `📝 시험 보너스 · ${a.subject} ${a.scoreType === "100" ? "100점" : "90점 이상"}`
              : `✋ 특별 미션`;
        const who = isCoopReward ? "3형제 팀" : displayName(a.kidId);
        const title = isCoopReward || isFamilyReward ? a.rewardName : a.questTitle;
        const rewardText = isCoopReward ? `${a.totalCost} 코인 / 팀 메달 ${a.teamMedalCost}` : isFamilyReward ? `-${a.cost} 코인` : `+${a.xp} XP / +${a.coins} 코인`;
        return `<div class="approval-card">
          <div class="card-top">
            <span><b>${who}</b> · ${title}</span>
            <span class="chip">${rewardText}</span>
          </div>
          <p class="card-sub" style="margin:0;">${typeLabel} · 요청 시간: ${timeStr}</p>
          <div class="approval-actions">
            <button class="btn gold" type="button" data-approve="${a.id}">✅ 승인</button>
            <button class="btn danger" type="button" data-reject="${a.id}">❌ 반려</button>
          </div>
        </div>`;
      }).join("")}</div>`;
    }

    function renderParent() {
      const pendingCount = (state.pendingApprovals || []).filter((a) => a.status === "pending").length;
      document.getElementById("tab-parent").innerHTML = `
        <section class="panel">
          <div class="panel-head">
            <h2>부모 비밀 메뉴</h2>
            <button class="btn alt small" type="button" id="toggleParent">${parentOpen ? "비밀 메뉴 닫기" : "비밀 메뉴 열기"}</button>
          </div>
          <div class="panel-body">
            ${!parentOpen
              ? `<p class="card-sub">아이들 게임 화면과 분리된 부모용 관리 메뉴입니다.</p>`
              : !parentUnlocked
              ? `<div class="parent-grid" style="grid-template-columns:1fr auto;">
                  <div class="field"><label for="parentPassword">비밀번호</label><input id="parentPassword" type="password" inputmode="numeric" placeholder="비밀번호를 입력하세요"></div>
                  <button class="btn" id="unlockParent" type="button">확인</button>
                </div>`
              : `<div class="stack">

                  <!-- 섹션 1: 포인트 관리 -->
                  <div class="notice-board">
                    <h3>① 포인트 관리</h3>
                    <div class="parent-grid" style="margin-top:10px;">
                      <div class="field"><label>아이</label><select id="parentKid">${KIDS.map((kid) => `<option value="${kid.id}" ${kid.id === selectedKidId ? "selected" : ""}>${displayName(kid.id)}</option>`).join("")}</select></div>
                      <div class="field"><label>종류</label><select id="parentType"><option value="both">XP+코인 추가</option><option value="xp">XP 추가</option><option value="coins">코인 추가</option><option value="coinsSub">코인 차감</option></select></div>
                      <div class="field"><label>수량</label><input id="parentAmount" type="number" min="1" placeholder="숫자 입력"></div>
                      <div class="field"><label>메모</label><input id="parentReason" type="text" placeholder="예: 특별 칭찬"></div>
                      <button class="btn" id="parentApply" type="button">적용</button>
                      <button class="btn danger" id="resetAll" type="button">전체 초기화</button>
                    </div>
                  </div>

                  <!-- 섹션 2: 승인 대기 미션 -->
                  <div class="notice-board">
                    <h3>② 승인 대기 미션${pendingCount ? `<span class="pending-badge">${pendingCount}</span>` : ""}</h3>
                    <p class="card-sub" style="margin-bottom:10px;">아이가 요청한 특별 미션을 확인하고 승인 또는 반려해 주세요.</p>
                    ${renderPendingApprovals()}
                  </div>

                  <!-- 섹션 3: 새 미션 아이디어 -->
                  <div class="notice-board">
                    <h3>③ 새 미션 아이디어</h3>
                    ${renderParentMissionIdeas()}
                  </div>

                  <!-- 섹션 4: 데이터 백업 -->
                  <div class="notice-board">
                    <h3>④ 데이터 백업</h3>
                    ${renderBackupStatus()}
                    <div class="parent-actions" style="margin-top:10px;">
                      <button class="btn alt" id="exportBackup" type="button">💾 백업 파일 다운로드</button>
                      <label class="btn alt" for="importBackup">📂 백업 파일 불러오기</label>
                      <input id="importBackup" type="file" accept="application/json,.json" hidden>
                    </div>
                    <p class="card-sub" style="margin-top:8px;">데이터를 안전하게 보관하려면 주 1회 백업을 권장합니다.</p>
                  </div>

                  <!-- 섹션 5: 초기화 -->
                  <div class="notice-board">
                    <h3>⑤ 초기화</h3>
                    <div class="parent-actions" style="margin-top:10px;">
                      <button class="btn alt" id="resetToday" type="button">오늘 체크 상태만 초기화</button>
                      <button class="btn alt" id="resetIdeas" type="button">아이디어 목록 초기화</button>
                    </div>
                  </div>

                  <!-- 섹션 6: 아이별 비밀 코드 관리 -->
                  <div class="notice-board">
                    <h3>⑥ 아이별 비밀 코드 관리</h3>
                    <p class="card-sub" style="margin-bottom:12px;">게임 입장 시 사용하는 비밀 코드입니다. 숫자 4자리 권장.</p>
                    ${KIDS.map((kid) => `
                      <div class="field" style="margin-bottom:10px;">
                        <label>${displayName(kid.id)} 비밀 코드</label>
                        <input class="pin-change-input" data-pin-kid="${kid.id}" type="text" inputmode="numeric" maxlength="4" value="${escapeHtml(state.gameMeta.kidPins?.[kid.id] || "1111")}" placeholder="4자리 숫자">
                      </div>`).join("")}
                    <button class="btn gold" id="savePinsBtn" type="button">🔐 비밀 코드 저장</button>
                  </div>

                  ${renderPwaInstallGuide()}
                  ${renderWeeklyClosingPanel()}
                  ${renderMonthlyClosingPanel()}

                </div>`}
          </div>
        </section>`;
      bindParentEvents();
    }

    function renderParentMissionIdeas() {
      const ideas = state.gameMeta.missionIdeas || [];
      if (!ideas.length) {
        return `<div class="empty">아직 제출된 새 미션 아이디어가 없습니다.</div>`;
      }
      return `<div class="stack">
        ${ideas.map((idea) => `<div class="vote-card">
          <div class="card-top"><span class="icon-box">💡</span><span class="state-pill ${idea.status === "selected" ? "ready" : idea.status === "rejected" ? "lock" : "target"}">${ideaStatusName(idea.status)}</span></div>
          <h4 class="card-title">${escapeHtml(idea.text)}</h4>
          <p class="card-sub">작성: ${ideaAuthorName(idea)} · ${formatIdeaDate(idea.createdAt)}</p>
          <label class="field">
            <span style="display:block;margin-bottom:6px;color:var(--muted);font-size:13px;font-weight:1000;">상태 변경</span>
            <select data-idea-status="${idea.id}">
              <option value="pending" ${idea.status === "pending" ? "selected" : ""}>검토 중</option>
              <option value="selected" ${idea.status === "selected" ? "selected" : ""}>채택</option>
              <option value="rejected" ${idea.status === "rejected" ? "selected" : ""}>보류</option>
            </select>
          </label>
        </div>`).join("")}
      </div>`;
    }

    function bindParentEvents() {
      document.getElementById("toggleParent")?.addEventListener("click", () => {
        parentOpen = !parentOpen;
        if (parentOpen) playSound("parent");
        renderParent();
      });
      document.getElementById("unlockParent")?.addEventListener("click", () => {
        if (document.getElementById("parentPassword").value === PARENT_PASSWORD) {
          parentUnlocked = true;
          playSound("parent");
          renderParent();
          showToast("비밀 메뉴가 열렸습니다.");
        } else { playSound("error"); showToast("비밀번호가 맞지 않아요"); }
      });
      document.getElementById("parentApply")?.addEventListener("click", parentAdjust);
      document.getElementById("resetToday")?.addEventListener("click", resetTodayOnly);
      document.getElementById("resetIdeas")?.addEventListener("click", resetMissionIdeas);
      document.querySelectorAll("[data-idea-status]").forEach((select) => select.addEventListener("change", () => updateMissionIdeaStatus(select.dataset.ideaStatus, select.value)));
      document.getElementById("resetAll")?.addEventListener("click", resetAllData);
      document.getElementById("exportBackup")?.addEventListener("click", exportBackup);
      document.getElementById("importBackup")?.addEventListener("change", (e) => importBackup(e.target.files[0]));
      document.querySelectorAll("[data-approve]").forEach((b) => b.addEventListener("click", () => approveQuest(b.dataset.approve)));
      document.querySelectorAll("[data-reject]").forEach((b) => b.addEventListener("click", () => rejectQuest(b.dataset.reject)));
      document.getElementById("savePinsBtn")?.addEventListener("click", updateKidPins);
      document.getElementById("refreshLatestVersion")?.addEventListener("click", refreshLatestVersion);
      document.getElementById("weeklyCloseBtn")?.addEventListener("click", closeCurrentWeek);
      document.getElementById("monthlyCloseBtn")?.addEventListener("click", closeCurrentMonth);
    }

    function parentAdjust() {
      const id = document.getElementById("parentKid").value;
      const type = document.getElementById("parentType").value;
      const amount = Math.max(1, Math.floor(Number(document.getElementById("parentAmount").value || 0)));
      const reason = document.getElementById("parentReason").value.trim() || "부모 직접 조정";
      const data = kidData(id);
      if (type === "both") addXpCoins(id, amount, amount);
      if (type === "xp") addXpCoins(id, amount, 0);
      if (type === "coins") addXpCoins(id, 0, amount);
      if (type === "coinsSub") spendCoins(id, amount);
      addHistory(`${displayName(id)}: ${reason} (${type}) ${amount}`);
      saveAndRender("부모 조정을 반영했습니다.");
    }

    function resetTodayOnly() {
      if (!confirm("오늘 체크 상태와 가족 보너스만 초기화할까요? XP와 코인은 유지됩니다.")) return;
      KIDS.forEach((kid) => { state.kids[kid.id].todayDone = {}; });
      state.familyBonuses = {};
      state.dailyChests = {};
      if (Array.isArray(state.pendingApprovals)) {
        state.pendingApprovals = state.pendingApprovals.filter((a) =>
          a.status !== "pending" || a.approvalType === "family_reward" || a.approvalType === "coop_reward"
        );
      }
      addHistory("부모 메뉴: 오늘 체크 상태 초기화");
      saveAndRender("오늘 체크 상태를 초기화했습니다.");
    }

    function resetAllData() {
      if (!confirm("전체 데이터를 모두 초기화할까요? 모든 XP, 코인, 아이템, 기록이 사라집니다.")) return;
      state = makeInitialState();
      selectedKidId = KIDS[0].id;
      activeTab = "character";
      parentOpen = false;
      parentUnlocked = false;
      saveAndRender("전체 데이터를 초기화했습니다.");
    }

    function exportBackup() {
      state.gameMeta.lastBackupAt = new Date().toISOString();
      addHistory("백업 파일을 저장했어요.");
      saveState();
      playSound("backup");
      const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), storageKey: STORAGE_KEY, data: state }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `kids-point-game-backup-${getTodayKey()}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("백업 파일을 다운로드했습니다.");
    }

    function importBackup(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const imported = parsed.data || parsed;
          if (!imported || !imported.kids) throw new Error("Invalid backup");
          if (!confirm("백업 파일의 데이터로 현재 데이터를 바꿀까요?")) return;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(imported));
          state = loadState();
          render();
          showToast("백업 파일을 불러왔습니다.");
        } catch (error) {
          showToast("백업 파일을 읽을 수 없습니다.");
        }
      };
      reader.readAsText(file);
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      if (String(message).includes("<")) {
        els.toast.innerHTML = message;
      } else {
        els.toast.textContent = message;
      }
      els.toast.classList.add("show");
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1900);
    }

    function isStandaloneAppMode() {
      return window.matchMedia?.("(display-mode: standalone)")?.matches || window.navigator.standalone === true;
    }

    function renderPwaInstallGuide() {
      const appMode = isStandaloneAppMode();
      return `<div class="notice-board">
        <h3>⑦ 패드 홈앱 설치 안내</h3>
        <p class="card-sub">${appMode ? "현재 앱 모드로 실행 중이에요." : "현재는 브라우저 모드예요. 홈 화면에 추가하면 더 앱처럼 사용할 수 있어요."}</p>
        <ol class="card-sub" style="margin:10px 0 0 20px;line-height:1.7;">
          <li>Chrome에서 게임 주소 열기</li>
          <li>오른쪽 위 점 3개 누르기</li>
          <li>홈 화면에 추가 선택</li>
          <li>이름을 우리집 미션 배틀로 설정</li>
          <li>홈 화면 아이콘으로 실행</li>
        </ol>
        <div class="parent-actions" style="margin-top:12px;">
          <button class="btn gold" id="refreshLatestVersion" type="button">최신 버전 다시 불러오기</button>
        </div>
        <p class="card-sub" style="margin-top:8px;">아이 데이터는 지우지 않아요. 앱 파일만 새로 받아옵니다.</p>
      </div>`;
    }

    async function refreshLatestVersion() {
      try {
        if ("serviceWorker" in navigator) {
          const registration = await navigator.serviceWorker.getRegistration("./");
          if (registration) await registration.update();
        }
        if ("caches" in window) {
          const names = await caches.keys();
          await Promise.all(names.filter((name) => name.includes("kids-mission-battle")).map((name) => caches.delete(name)));
        }
      } catch (error) {
        console.warn("최신 버전 갱신 준비 중 문제가 있었지만 데이터를 지우지 않고 새로고침합니다.", error);
      } finally {
        window.location.reload();
      }
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) return;
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.warn("Service Worker 등록 실패", error);
        });
      });
    }

    function startAppSplashThenGate() {
      window.setTimeout(() => {
        document.getElementById("appSplash")?.classList.add("app-splash-hidden");
        renderKidGate();
      }, 950);
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => btn.addEventListener("click", () => {
      activeTab = btn.dataset.tab;
      playSound("tab");
      saveAndRender();
    }));

    document.getElementById("soundToggle")?.addEventListener("click", toggleSound);
    document.getElementById("switchKidBtn")?.addEventListener("click", lockKidGate);

    function render() {
      els.todayDate.textContent = formatKoreanDate(state.date);
      document.querySelectorAll(".tab-page").forEach((el) => el.classList.toggle("active", el.id === `tab-${activeTab}`));
      document.querySelectorAll(".tab-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === activeTab));
      const soundBtn = document.getElementById("soundToggle");
      if (soundBtn) soundBtn.textContent = state.gameMeta.soundEnabled ? "🔊" : "🔇";
      renderPlayerStrip();
      renderCharacter();
      renderMissions();
      renderLeague();
      renderShop();
      renderInventory();
      renderParent();
      renderSettingsModal();
    }

    registerServiceWorker();
    render();
    startAppSplashThenGate();
  </script>
</body>
</html>
