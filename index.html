<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>우리집 미션 배틀</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <meta name="theme-color" content="#2f3dce" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="우리집 미션 배틀" />
  <style>
    /*
      ==============================
      Game Lobby Base
      ==============================
    */
    :root {
      --ink: #16214a;
      --muted: #7280a6;
      --panel: rgba(255, 255, 255, 0.94);
      --line: rgba(225, 233, 255, 0.95);
      --blue: #2f7bff;
      --sky: #32b7ff;
      --mint: #28df9b;
      --yellow: #ffd84d;
      --orange: #ff8845;
      --pink: #ff4fa3;
      --purple: #7c4dff;
      --danger: #ec4058;
      --radius: 22px;
      --shadow: 0 16px 0 rgba(9, 18, 62, 0.16), 0 28px 48px rgba(5, 10, 38, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 216, 77, 0.38), transparent 19%),
        radial-gradient(circle at 88% 14%, rgba(40, 223, 155, 0.26), transparent 23%),
        radial-gradient(circle at 52% 86%, rgba(255, 79, 163, 0.19), transparent 28%),
        linear-gradient(135deg, #101f63 0%, #6038c8 48%, #19b8e6 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.58), transparent 82%);
    }

    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.62; filter: grayscale(0.55); }

    .app {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 106px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      min-height: 118px;
      padding: 22px;
      border: 2px solid rgba(255, 255, 255, 0.28);
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08)),
        linear-gradient(135deg, rgba(27, 44, 126, 0.86), rgba(102, 57, 201, 0.74));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(34px, 6vw, 60px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: 0;
      text-shadow: 0 5px 0 rgba(13, 26, 83, 0.36), 0 12px 26px rgba(0, 0, 0, 0.22);
    }

    .hero p {
      margin: 10px 0 0;
      color: #ecf8ff;
      font-size: 18px;
      font-weight: 900;
    }

    .date-pill {
      display: grid;
      gap: 3px;
      min-width: 178px;
      padding: 13px 16px;
      border: 2px solid rgba(255, 255, 255, 0.58);
      border-radius: 999px;
      background: linear-gradient(135deg, #fff 0%, #dff6ff 100%);
      color: #173271;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(12, 28, 90, 0.22), 0 20px 34px rgba(0, 0, 0, 0.2);
      white-space: nowrap;
    }

    .date-pill small {
      color: var(--pink);
      font-size: 11px;
      font-weight: 1000;
    }

    /*
      ==============================
      Shared Components
      ==============================
    */
    .panel {
      border: 2px solid rgba(255, 255, 255, 0.38);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 17px 19px;
      border-bottom: 2px solid rgba(27, 47, 120, 0.09);
      background: linear-gradient(135deg, rgba(50, 183, 255, 0.14), rgba(124, 77, 255, 0.11));
    }

    .panel-head h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 1000;
      letter-spacing: 0;
    }

    .panel-body { padding: 18px; }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 7px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, #1c2f78, #2467ff);
      color: #fff;
      font-size: 13px;
      font-weight: 1000;
      border: 2px solid rgba(255, 255, 255, 0.46);
      box-shadow: 0 5px 0 rgba(12, 20, 68, 0.16);
      white-space: nowrap;
    }

    .btn {
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.52);
      color: #fff;
      background: linear-gradient(135deg, var(--sky), var(--blue));
      font-weight: 1000;
      box-shadow: 0 7px 0 rgba(13, 28, 83, 0.22), 0 14px 28px rgba(0, 0, 0, 0.16);
      transition: transform 0.13s ease, filter 0.13s ease, box-shadow 0.13s ease;
      touch-action: manipulation;
    }

    .btn:hover { filter: brightness(1.05); transform: translateY(-2px); }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 rgba(13, 28, 83, 0.24), 0 9px 18px rgba(0, 0, 0, 0.14);
      filter: brightness(0.90);
    }

    .btn.alt { background: linear-gradient(135deg, #f7f9ff, #dfeaff); color: #1b3f95; border-color: #cbd9ff; }
    .btn.gold { background: linear-gradient(135deg, var(--yellow), var(--orange)); color: #4b2a00; }
    .btn.danger { background: linear-gradient(135deg, #ff7b8d, var(--danger)); }
    .btn.small { min-height: 40px; padding: 9px 12px; font-size: 14px; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .stack { display: grid; gap: 14px; }

    .stat {
      padding: 12px;
      border: 2px solid #e1e9ff;
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, #f0f5ff);
      box-shadow: inset 0 -4px 0 rgba(24, 50, 113, 0.06);
    }

    .stat span {
      display: block;
      color: #687494;
      font-size: 12px;
      font-weight: 1000;
      margin-bottom: 5px;
    }

    .stat strong {
      display: block;
      color: #14204d;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 1000;
    }

    .xp-bar {
      height: 24px;
      padding: 4px;
      border-radius: 999px;
      background: #1d2d6d;
      box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.23);
      overflow: hidden;
    }

    .xp-bar span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), var(--yellow), var(--orange));
      box-shadow: 0 0 16px rgba(255, 216, 77, 0.62);
      transition: width 0.3s ease;
    }

    /*
      ==============================
      Player Selector
      ==============================
    */
    .player-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
      margin: 16px 0;
    }

    .player-mini {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
      min-height: 92px;
      padding: 13px;
      border: 2px solid rgba(255, 255, 255, 0.42);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(238,244,255,0.96));
      box-shadow: 0 10px 0 rgba(9, 18, 62, 0.12), 0 18px 32px rgba(5, 10, 38, 0.18);
      text-align: left;
    }

    .player-mini.active {
      border-color: var(--yellow);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--kid-color) 30%, transparent), 0 12px 0 rgba(9, 18, 62, 0.15), 0 20px 38px rgba(5, 10, 38, 0.24);
    }

    .mini-avatar, .avatar-big {
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 5px solid #fff;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.82), transparent 24%),
        linear-gradient(135deg, color-mix(in srgb, var(--kid-color) 82%, #fff), var(--kid-color));
      color: #fff;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
      box-shadow: 0 9px 0 rgba(19, 33, 93, 0.16), 0 14px 28px rgba(0, 0, 0, 0.2);
    }

    .mini-avatar { width: 58px; height: 58px; font-size: 28px; }
    .avatar-big { width: 156px; height: 156px; font-size: 62px; }

    .avatar-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      z-index: 2;
    }

    .avatar-fallback {
      position: relative;
      z-index: 1;
    }

    .character-visual {
      position: relative;
      display: grid;
      place-items: center;
      width: var(--visual-size, 156px);
      height: var(--visual-size, 156px);
      margin: 0 auto;
      border-radius: 999px;
      isolation: isolate;
      animation: guardianFloat 3s ease-in-out infinite;
    }

    .character-visual.mini { --visual-size: 58px; }
    .character-visual.preview { --visual-size: 82px; }
    .character-visual.photo { --visual-size: 86px; }
    .character-visual.big { --visual-size: 156px; }

    .visual-core {
      position: relative;
      z-index: 4;
      width: calc(var(--visual-size) * .9);
      height: calc(var(--visual-size) * .9);
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: max(3px, calc(var(--visual-size) * .032)) solid #fff;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.82), transparent 24%),
        linear-gradient(135deg, color-mix(in srgb, var(--kid-color) 82%, #fff), var(--kid-color));
      color: #fff;
      font-size: calc(var(--visual-size) * .38);
      text-shadow: 0 4px 0 rgba(0,0,0,.18);
      box-shadow: 0 10px 0 rgba(19,33,93,.16), 0 0 30px color-mix(in srgb, var(--kid-color) 28%, transparent);
      overflow: hidden;
    }

    .visual-aura {
      position: absolute;
      inset: -22%;
      z-index: 1;
      border-radius: 999px;
      background: var(--visual-aura, radial-gradient(circle, color-mix(in srgb, var(--kid-color) 44%, transparent), transparent 66%));
      opacity: var(--visual-aura-opacity, .30);
      filter: blur(12px);
      animation: auraPulse 2.4s ease-in-out infinite;
    }

    .visual-ring {
      position: absolute;
      inset: 2%;
      z-index: 2;
      border-radius: 999px;
      border: var(--visual-frame, 3px solid rgba(255,255,255,.75));
      pointer-events: none;
    }

    .visual-layer {
      position: absolute;
      z-index: 6;
      display: grid;
      place-items: center;
      width: calc(var(--visual-size) * .42);
      height: calc(var(--visual-size) * .42);
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      border: 2px solid rgba(255,255,255,.95);
      box-shadow: 0 6px 0 rgba(9,18,62,.14), 0 0 10px rgba(255,255,255,.55);
      font-size: calc(var(--visual-size) * .28);
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.22));
    }

    .visual-head { top: -14%; left: 50%; translate: -50% 0; }
    .visual-weapon { left: -19%; bottom: 16%; rotate: -18deg; }
    .visual-pet { right: -20%; bottom: 4%; animation: petBounce 2.1s ease-in-out infinite; }
    .visual-badge { right: -4%; top: 2%; width: calc(var(--visual-size) * .30); height: calc(var(--visual-size) * .30); font-size: calc(var(--visual-size) * .19); }

    .character-visual.aura-fire { --visual-aura: radial-gradient(circle,#ff8845,transparent 66%); --visual-aura-opacity: .72; }
    .character-visual.aura-lightning { --visual-aura: radial-gradient(circle,#fff173 0%,#2ee59d 35%,transparent 68%); --visual-aura-opacity: .65; animation: runnerFlash 1.9s ease-in-out infinite; }
    .character-visual.aura-blue { --visual-aura: radial-gradient(circle,#2f7bff,transparent 66%); --visual-aura-opacity: .60; }
    .character-visual.aura-gold { --visual-aura: radial-gradient(circle,#ffd84d,transparent 66%); --visual-aura-opacity: .75; }
    .character-visual.frame-blue { --visual-frame: 7px solid #3f7cff; }
    .character-visual.frame-fire { --visual-frame: 7px solid #ff8845; }
    .character-visual.frame-gold { --visual-frame: 8px solid #ffd84d; }
    .character-visual.frame-mythic .visual-ring,
    .character-visual.frame-gold .visual-ring { animation: frameShine 2.6s ease-in-out infinite; }
    .character-visual.frame-blue .visual-ring { box-shadow: 0 0 20px rgba(63,124,255,.55), inset 0 0 14px rgba(63,124,255,.18); }
    .character-visual.frame-fire .visual-ring { box-shadow: 0 0 20px rgba(255,136,69,.62), inset 0 0 14px rgba(255,136,69,.22); }
    .character-visual.frame-gold .visual-ring { box-shadow: 0 0 24px rgba(255,216,77,.72), inset 0 0 16px rgba(255,216,77,.26); }
    .character-visual.frame-mythic .visual-ring { box-shadow: 0 0 28px rgba(255,79,163,.72), inset 0 0 18px rgba(255,79,163,.28); }

    .preview-box {
      display: grid;
      place-items: center;
      min-height: 112px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,.78), rgba(232,240,255,.72));
      border: 2px solid rgba(255,255,255,.82);
    }

    .player-mini h3 { margin: 0; font-size: 22px; font-weight: 1000; }
    .player-mini p { margin: 5px 0 0; color: var(--muted); font-weight: 900; font-size: 13px; }

    /*
      ==============================
      Tabs
      ==============================
    */
    .tab-page { display: none; }
    .tab-page.active { display: block; animation: pagePop 0.18s ease; }

    .bottom-tabs {
      position: fixed;
      left: 50%;
      bottom: 12px;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(6, minmax(74px, 1fr));
      gap: 7px;
      width: min(760px, calc(100% - 20px));
      padding: 9px;
      border: 2px solid rgba(255,255,255,0.38);
      border-radius: 24px;
      background: rgba(18, 31, 92, 0.88);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.28);
      transform: translateX(-50%);
      backdrop-filter: blur(10px);
    }

    .tab-btn {
      display: grid;
      place-items: center;
      gap: 2px;
      min-height: 58px;
      padding: 7px 5px;
      border-radius: 17px;
      color: #d9e7ff;
      background: rgba(255,255,255,0.08);
      font-size: 12px;
      font-weight: 1000;
    }

    .tab-btn b { font-size: 20px; line-height: 1; }
    .tab-btn.active { background: linear-gradient(135deg, var(--yellow), var(--orange)); color: #3f2500; box-shadow: inset 0 -4px 0 rgba(92, 45, 0, 0.15); }

    /*
      ==============================
      Character
      ==============================
    */
    .character-layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.2fr);
      gap: 16px;
      align-items: stretch;
    }

    .character-stage {
      position: relative;
      display: grid;
      justify-items: center;
      align-content: center;
      min-height: 430px;
      padding: 24px;
      border-radius: 28px;
      background: var(--stage-bg, linear-gradient(135deg, #dff6ff, #fff4c4));
      border: 2px solid #fff;
      overflow: hidden;
      box-shadow: inset 0 -10px 0 rgba(24, 50, 113, 0.08);
    }

    .character-stage.defender {
      background:
        radial-gradient(circle at 50% 42%, rgba(47, 123, 255, 0.38), transparent 34%),
        linear-gradient(135deg, #dff1ff, #e9f0ff 48%, #fff4c4);
    }

    .character-stage.runner {
      background:
        radial-gradient(circle at 50% 42%, rgba(40, 223, 155, 0.34), transparent 34%),
        linear-gradient(135deg, #e2fff4, #e9fff8 48%, #e7f7ff);
    }

    .character-stage.fighter {
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 136, 69, 0.38), transparent 34%),
        linear-gradient(135deg, #fff0df, #fff6e4 48%, #ffe5d8);
    }

    .character-stage::before {
      content: "";
      position: absolute;
      inset: 24px;
      border: var(--frame-border, 0 solid transparent);
      border-radius: 28px;
      pointer-events: none;
    }

    .aura {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 999px;
      background: var(--aura-bg, transparent);
      filter: blur(18px);
      opacity: var(--aura-opacity, 0);
      animation: pulseGlow 2s ease-in-out infinite;
    }

    .avatar-wrap { position: relative; z-index: 1; display: grid; place-items: center; }
    .avatar-wrap::before,
    .avatar-wrap::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
    }

    .avatar-wrap::before {
      width: 210px;
      height: 210px;
      border: 4px solid color-mix(in srgb, var(--kid-color) 55%, transparent);
      box-shadow: 0 0 34px color-mix(in srgb, var(--kid-color) 42%, transparent);
      animation: heroAura 2.6s ease-in-out infinite;
    }

    .avatar-wrap::after {
      width: 118px;
      height: 18px;
      bottom: -16px;
      background: rgba(18, 31, 92, 0.18);
      filter: blur(2px);
    }

    .class-mark {
      position: absolute;
      left: 50%;
      bottom: 88px;
      z-index: 2;
      translate: -50% 0;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.84);
      border: 2px solid rgba(255, 255, 255, 0.95);
      color: #16214a;
      font-size: 13px;
      font-weight: 1000;
      box-shadow: 0 7px 0 rgba(9, 18, 62, 0.12);
    }
    .head-item { position: absolute; top: -13px; z-index: 2; font-size: 42px; }
    .weapon-item { position: absolute; left: -42px; bottom: 28px; z-index: 2; font-size: 48px; transform: rotate(-18deg); }
    .pet-item { position: absolute; right: -42px; bottom: 4px; z-index: 2; font-size: 46px; }
    .pet-item { animation: petBounce 2.1s ease-in-out infinite; }

    .character-stage.defender .avatar-wrap { animation: guardianFloat 3.2s ease-in-out infinite; }
    .character-stage.runner .avatar-wrap { animation: runnerFlash 1.9s ease-in-out infinite; }
    .character-stage.fighter .avatar-wrap { animation: fighterFlame 2.4s ease-in-out infinite; }
    .character-stage.defender .avatar-big { box-shadow: 0 12px 0 rgba(19, 33, 93, 0.18), 0 0 34px rgba(47, 123, 255, 0.34); }
    .character-stage.runner .avatar-big { box-shadow: 0 12px 0 rgba(19, 33, 93, 0.18), 0 0 34px rgba(40, 223, 155, 0.34); }
    .character-stage.fighter .avatar-big { box-shadow: 0 12px 0 rgba(19, 33, 93, 0.18), 0 0 34px rgba(255, 136, 69, 0.42); }

    .nickname {
      position: relative;
      z-index: 1;
      margin: 18px 0 8px;
      font-size: 32px;
      font-weight: 1000;
      text-align: center;
    }

    .equipped-line {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
    }

    .next-reward {
      padding: 16px;
      border: 2px solid #ffe47b;
      border-radius: 22px;
      background: linear-gradient(135deg, #fff7cf, #ffe794);
      box-shadow: 0 8px 0 rgba(98, 63, 0, 0.12);
    }

    .next-reward.featured {
      border-width: 3px;
      background:
        radial-gradient(circle at 16% 18%, rgba(255,255,255,0.9), transparent 26%),
        linear-gradient(135deg, #fff7bf, #ffd84d 52%, #ff9c45);
      box-shadow: 0 12px 0 rgba(98, 63, 0, 0.16), 0 20px 34px rgba(255, 136, 69, 0.24);
    }

    .next-reward h3 { margin: 0 0 8px; font-size: 24px; font-weight: 1000; color: #4b2a00; }
    .next-reward p { margin: 0; color: #6a4a00; font-size: 17px; font-weight: 1000; }

    .equipped-board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .equip-chip {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
      min-height: 48px;
      padding: 9px 10px;
      border: 2px solid #e1e9ff;
      border-radius: 16px;
      background: linear-gradient(180deg, #fff, #f3f7ff);
      font-weight: 1000;
    }

    .equip-chip small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 2px;
    }

    /*
      ==============================
      Cards
      ==============================
    */
    .mission-card, .shop-card, .inventory-card, .league-card, .log-card, .team-card {
      position: relative;
      display: grid;
      gap: 10px;
      padding: 15px;
      border: 2px solid #e1e9ff;
      border-radius: 22px;
      background: linear-gradient(180deg, #ffffff, #f4f8ff);
      box-shadow: 0 10px 0 rgba(26, 44, 105, 0.08), 0 16px 26px rgba(13, 28, 83, 0.09);
      overflow: hidden;
    }

    .mission-card.clear { border-color: rgba(40, 223, 155, 0.72); background: linear-gradient(180deg, #effff9, #dcfff1); animation: clearBounce 0.42s ease; }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .icon-box {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border: 2px solid #e1e9ff;
      border-radius: 18px;
      background: #fff;
      font-size: 30px;
      box-shadow: inset 0 -4px 0 rgba(24, 50, 113, 0.07);
      flex: 0 0 auto;
    }

    .card-title { margin: 0; font-size: 18px; font-weight: 1000; line-height: 1.25; }
    .card-sub { margin: 0; color: var(--muted); font-weight: 900; line-height: 1.45; }
    .reward-line { color: #0c9d70; font-weight: 1000; }
    .locked { background: linear-gradient(180deg, #f9fbff, #edf2ff); }

    .shop-card {
      min-height: 218px;
      align-content: start;
    }

    .shop-card.next-target {
      border-color: var(--yellow);
      box-shadow: 0 0 0 4px rgba(255, 216, 77, 0.18), 0 10px 0 rgba(26, 44, 105, 0.08), 0 18px 30px rgba(255, 136, 69, 0.18);
    }

    .rarity-common { border-color: #d9e2f5; }
    .rarity-rare { border-color: #35a7ff; box-shadow: 0 10px 0 rgba(26,44,105,.08), 0 0 18px rgba(53,167,255,.18); }
    .rarity-epic { border-color: #7c4dff; box-shadow: 0 10px 0 rgba(26,44,105,.08), 0 0 20px rgba(124,77,255,.22); }
    .rarity-legend { border-color: #ffd84d; box-shadow: 0 10px 0 rgba(26,44,105,.08), 0 0 24px rgba(255,216,77,.34); }
    .rarity-mythic {
      border-color: #ff4fa3;
      background: linear-gradient(180deg, #fff, #fff4fb 42%, #f4f7ff);
      box-shadow: 0 10px 0 rgba(26,44,105,.08), 0 0 26px rgba(255,79,163,.34);
    }

    .state-pill {
      display: inline-flex;
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef4ff;
      color: #29458d;
      font-size: 12px;
      font-weight: 1000;
    }

    .state-pill.ready { background: #ddfff2; color: #087755; }
    .state-pill.target { background: #fff4c4; color: #704700; }
    .state-pill.lock { background: #edf1fb; color: #65708f; }
    .state-pill.equipped { background: #e9ddff; color: #4d2aa0; }

    .challenge-box {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
      padding: 15px;
      border: 2px solid rgba(255, 255, 255, 0.78);
      border-radius: 22px;
      background: linear-gradient(135deg, #fff7cf, #e3f7ff);
      box-shadow: 0 8px 0 rgba(26, 44, 105, 0.08);
      font-weight: 1000;
    }

    .challenge-box h3 { margin: 0; font-size: 20px; }
    .challenge-box p { margin: 0; color: #556181; line-height: 1.45; }

    .notice-board,
    .vote-board,
    .photo-studio {
      padding: 15px;
      border: 2px solid rgba(255,255,255,0.78);
      border-radius: 24px;
      background: linear-gradient(135deg, #fff7cf, #e3f7ff);
      box-shadow: 0 8px 0 rgba(26, 44, 105, 0.08);
    }

    .notice-board h3,
    .vote-board h3,
    .photo-studio h3 {
      margin: 0 0 10px;
      font-size: 21px;
      font-weight: 1000;
    }

    .notice-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .notice-list li {
      padding: 9px 11px;
      border-radius: 16px;
      background: rgba(255,255,255,0.62);
      color: #556181;
      font-weight: 1000;
    }

    .vote-card {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 2px solid #e1e9ff;
      border-radius: 18px;
      background: rgba(255,255,255,0.76);
    }

    .vote-result {
      height: 16px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(29, 45, 109, 0.18);
      overflow: hidden;
    }

    .vote-result span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), var(--sky));
    }

    .photo-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 12px;
    }

    .team-photo {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      min-height: 280px;
      padding: 18px;
      border: 3px solid rgba(255,255,255,0.8);
      border-radius: 26px;
      background: var(--photo-bg, linear-gradient(135deg, #dff6ff, #fff4c4));
      box-shadow: inset 0 -10px 0 rgba(24, 50, 113, 0.08);
    }

    .team-photo.space { --photo-bg: linear-gradient(135deg, #131852, #572cb8 50%, #111); }
    .team-photo.fire { --photo-bg: linear-gradient(135deg, #531b15, #ff8845 56%, #ffd84d); }
    .team-photo.lightning { --photo-bg: linear-gradient(135deg, #073a43, #20b486 52%, #d9fff4); }
    .team-photo.camp { --photo-bg: linear-gradient(135deg, #d9f8ce, #fff1b8 54%, #ffca83); }

    .photo-player {
      display: grid;
      justify-items: center;
      align-content: end;
      gap: 8px;
      min-height: 230px;
      padding: 12px;
      border-radius: 22px;
      background: rgba(255,255,255,0.56);
      text-align: center;
      font-weight: 1000;
    }

    .photo-player .mini-avatar {
      width: 86px;
      height: 86px;
      font-size: 42px;
    }

    .empty {
      padding: 22px;
      border: 2px dashed #cbd7f3;
      border-radius: 22px;
      background: #f7f9ff;
      color: var(--muted);
      text-align: center;
      font-weight: 1000;
    }

    .league-awards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .award-card {
      padding: 14px;
      border-radius: 22px;
      background: linear-gradient(135deg, #fff7cf, #e3f7ff);
      border: 2px solid rgba(255,255,255,0.78);
      box-shadow: 0 8px 0 rgba(26, 44, 105, 0.08);
      text-align: center;
      font-weight: 1000;
    }

    .award-card b { display: block; font-size: 26px; margin-bottom: 6px; }

    /*
      ==============================
      Parent Menu
      ==============================
    */
    .parent-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr auto auto;
      gap: 10px;
      align-items: end;
    }

    .field label {
      display: block;
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 1000;
    }

    input, select {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 2px solid #d5def3;
      border-radius: 16px;
      background: #fff;
      color: var(--ink);
      font-weight: 900;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 123, 255, 0.16);
    }

    .parent-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 13px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 92px;
      z-index: 30;
      max-width: calc(100% - 32px);
      padding: 13px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #172860, #2467ff);
      color: #fff;
      font-weight: 1000;
      border: 2px solid rgba(255,255,255,0.45);
      box-shadow: 0 9px 0 rgba(12,20,68,0.2), 0 22px 34px rgba(0,0,0,0.24);
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(18px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast strong {
      display: block;
      margin-bottom: 2px;
      font-size: 15px;
    }

    .toast span {
      display: block;
      font-size: 13px;
      color: #e7f2ff;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(8, 16, 56, .62);
      backdrop-filter: blur(8px);
    }

    .game-modal {
      width: min(520px, 100%);
      border: 2px solid rgba(255,255,255,.48);
      border-radius: 28px;
      background: linear-gradient(180deg, #fff, #eef5ff);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .game-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 17px 18px;
      background: linear-gradient(135deg, rgba(50,183,255,.18), rgba(124,77,255,.14));
      border-bottom: 2px solid rgba(27,47,120,.09);
    }

    .game-modal-head h2 { margin: 0; font-size: 24px; font-weight: 1000; }
    .game-modal-body { display: grid; gap: 14px; padding: 18px; }

    .avatar-choice-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .avatar-choice {
      min-height: 52px;
      border-radius: 16px;
      background: #fff;
      border: 2px solid #dfe8ff;
      font-size: 26px;
      box-shadow: inset 0 -4px 0 rgba(24,50,113,.06);
    }

    .avatar-choice.selected {
      border-color: var(--yellow);
      background: #fff7cf;
      box-shadow: 0 0 0 4px rgba(255,216,77,.18);
    }

    .app-splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,216,77,.34), transparent 24%),
        radial-gradient(circle at 70% 72%, rgba(40,223,155,.22), transparent 28%),
        linear-gradient(135deg, #101f63 0%, #6038c8 52%, #19b8e6 100%);
      color: #fff;
      transition: opacity .22s ease, visibility .22s ease;
    }

    .app-splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .app-splash-card {
      display: grid;
      justify-items: center;
      gap: 12px;
      text-align: center;
    }

    .app-splash-logo {
      position: relative;
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      border-radius: 30px;
      background: linear-gradient(135deg, #2f7bff, #7c4dff);
      border: 4px solid rgba(255,255,255,.6);
      box-shadow: 0 13px 0 rgba(9,18,62,.2), 0 22px 44px rgba(0,0,0,.24);
      font-size: 56px;
      animation: guardianFloat 2.2s ease-in-out infinite;
    }

    .app-splash-logo::before {
      content: "⭐";
      position: absolute;
      right: -8px;
      top: -10px;
      font-size: 34px;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,.16));
    }

    .app-splash-logo::after {
      content: "🧰";
      position: absolute;
      left: -10px;
      bottom: -8px;
      font-size: 34px;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,.16));
    }

    .app-splash-title {
      margin: 0;
      font-size: 34px;
      font-weight: 1000;
      text-shadow: 0 5px 0 rgba(13,26,83,.35);
    }

    .app-splash-subtitle {
      margin: 0;
      color: #e9f7ff;
      font-size: 17px;
      font-weight: 900;
    }

    @keyframes pagePop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes clearBounce { 0% { transform: scale(1); } 45% { transform: scale(1.025); } 100% { transform: scale(1); } }
    @keyframes pulseGlow { 0%,100% { transform: scale(0.94); opacity: var(--aura-opacity, 0); } 50% { transform: scale(1.08); opacity: calc(var(--aura-opacity, 0) + 0.12); } }
    @keyframes heroAura { 0%, 100% { scale: 0.94; opacity: 0.72; } 50% { scale: 1.04; opacity: 1; } }
    @keyframes guardianFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes runnerFlash { 0%,100% { transform: translateX(0); filter: brightness(1); } 45% { transform: translateX(4px); filter: brightness(1.18); } 52% { transform: translateX(-3px); } }
    @keyframes fighterFlame { 0%,100% { transform: translateY(0) rotate(-1deg); filter: saturate(1); } 50% { transform: translateY(-5px) rotate(1deg); filter: saturate(1.2); } }
    @keyframes petBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes auraPulse { 0%,100% { transform: scale(.9); opacity: var(--visual-aura-opacity,.22); } 50% { transform: scale(1.09); opacity: calc(var(--visual-aura-opacity,.22) + .12); } }
    @keyframes frameShine { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }

    /*
      ==============================
      Responsive Layout
      ==============================
    */

    /* Tablet Portrait: 481px ~ 900px */
    @media (max-width: 900px) {
      .app { padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
      .character-layout { grid-template-columns: 1fr; }
      .character-stage { min-height: 320px; }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .player-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .parent-grid { grid-template-columns: 1fr 1fr; }
      .bottom-tabs { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .tab-btn { min-height: 54px; }
    }

    /* Mobile: ≤ 480px */
    @media (max-width: 480px) {
      /* ── 레이아웃 ── */
      .app {
        width: calc(100% - 16px);
        padding-top: 8px;
        padding-bottom: calc(168px + env(safe-area-inset-bottom, 0px));
      }
      .hero {
        grid-template-columns: 1fr auto;
        min-height: auto;
        padding: 10px 12px;
        border-radius: 18px;
        gap: 8px;
      }
      .hero h1 { font-size: 22px; }
      .hero p { display: none; }
      .date-pill { min-width: 0; min-height: 40px; padding: 6px 10px; font-size: 11px; }
      .date-pill small { font-size: 9px; }
      .panel-head { align-items: flex-start; flex-direction: column; gap: 8px; }
      .panel-body { padding: 12px; }
      .character-layout { grid-template-columns: 1fr; }
      .parent-grid { grid-template-columns: 1fr; }

      /* ── 플레이어 선택 카드 ── */
      .player-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 7px 0 10px; }
      .player-mini { grid-template-columns: 1fr; justify-items: center; gap: 3px; min-height: 78px; padding: 7px 5px; border-radius: 14px; text-align: center; }
      .player-mini h3 { font-size: 13px; }
      .player-mini p { margin-top: 1px; font-size: 9px; line-height: 1.2; }

      /* ── 하단 탭 ── */
      .bottom-tabs { grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 7px; }
      .tab-btn { min-height: 50px; font-size: 11px; gap: 1px; }
      .tab-btn b { font-size: 18px; }

      /* ── 내 캐릭터 스테이지 ── */
      .character-stage { min-height: 260px; padding: 14px; }
      .character-visual.big { --visual-size: 120px; }
      .avatar-wrap::before { width: 162px; height: 162px; }
      .class-mark { bottom: 10px; font-size: 11px; padding: 5px 10px; }
      .nickname { font-size: 24px; margin: 10px 0 5px; }
      .equipped-line { gap: 5px; }
      .equipped-line .chip { font-size: 11px; padding: 5px 8px; min-height: 26px; }

      /* ── 미션 탭: 1열 ── */
      #tab-missions .grid-2 { grid-template-columns: 1fr; }

      /* ── 스킨샵 탭: 1열 ── */
      #tab-shop .grid-3 { grid-template-columns: 1fr; }

      /* ── 형제 리그 탭 ── */
      #tab-league .grid-3 { grid-template-columns: 1fr; }
      .league-awards { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .award-card { padding: 9px 6px; font-size: 13px; }
      .award-card b { font-size: 20px; margin-bottom: 4px; }

      /* ── 미션 아이디어 입력 ── */
      .vote-board .grid-2 { grid-template-columns: 1fr; }

      /* ── 버튼 전체 너비 (필터 버튼 제외) ── */
      .btn:not(.small) { width: 100%; }

      /* ── 필터/배경 버튼: 가로 스크롤 ── */
      .photo-controls {
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }
      .photo-controls .btn { flex-shrink: 0; width: auto; }

      /* ── 카드 여백 축소 ── */
      .shop-card { min-height: auto; }
      .mission-card, .shop-card, .inventory-card { padding: 12px; }
      .notice-board, .vote-board, .photo-studio, .challenge-box { padding: 12px; }
      .next-reward { padding: 12px; }
      .equip-chip { padding: 7px 8px; min-height: 42px; }
      .stat { padding: 10px; }
      .stat strong { font-size: 18px; }

      /* ── 팀 사진관 ── */
      .team-photo { gap: 6px; padding: 8px; min-height: 170px; }
      .photo-player { min-height: 130px; padding: 8px 6px; }
      .character-visual.photo { --visual-size: 60px; }
    }
    /* ── 효과음 토글 버튼 ── */
    .sound-btn {
      position: fixed; right: 14px; top: 14px; z-index: 25;
      width: 40px; height: 40px; border-radius: 999px;
      background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.44);
      color: #fff; font-size: 18px; display: grid; place-items: center;
      cursor: pointer; backdrop-filter: blur(4px);
      box-shadow: 0 4px 12px rgba(0,0,0,.18); transition: background .14s;
      touch-action: manipulation;
    }
    .sound-btn:hover { background: rgba(255,255,255,.36); }
    .sound-btn:active { transform: scale(.91); }

    /* ── 보물상자 섹션 ── */
    .chest-section {
      padding: 16px; border-radius: 24px;
      background: linear-gradient(135deg, #fff7bf, #ffd84d 50%, #ff9c45);
      border: 2px solid rgba(255,255,255,.82);
      box-shadow: 0 8px 0 rgba(98,63,0,.14), 0 18px 28px rgba(255,136,69,.18);
    }
    .chest-section h3 { margin: 0 0 8px; font-size: 21px; font-weight: 1000; color: #4b2a00; }
    .chest-section p { margin: 0 0 10px; color: #6a4a00; font-weight: 900; line-height: 1.45; }
    @keyframes chestPop { 0%,100%{transform:scale(1)} 40%{transform:scale(1.06)} }
    .chest-pop { animation: chestPop .45s ease; }

    /* ── 승인 카드 ── */
    .approval-card {
      display: grid; gap: 10px; padding: 13px;
      border: 2px solid #ffe0b2; border-radius: 20px;
      background: linear-gradient(180deg, #fff8f0, #fff3e0);
      box-shadow: 0 6px 0 rgba(180,80,0,.07);
    }
    .approval-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .approval-actions .btn { flex: 1; min-width: 80px; width: auto !important; }
    .pending-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 5px;
      border-radius: 999px; background: var(--danger); color: #fff;
      font-size: 12px; font-weight: 1000; margin-left: 6px;
    }

    /* ── 백업 알림 ── */
    .backup-warn { color: var(--danger); font-weight: 1000; padding: 10px 14px; border-radius: 14px; background: #fff0f0; border: 2px solid #ffd0d0; margin-bottom: 10px; }
    .backup-ok   { color: #087755;       font-weight: 1000; padding: 10px 14px; border-radius: 14px; background: #f0fff8; border: 2px solid #b0f0d8; margin-bottom: 10px; }

    /* ── 보물상자 오픈 연출 ── */
    .chest-opening-overlay {
      position: fixed; inset: 0; z-index: 62;
      background: rgba(6,12,48,.9); backdrop-filter: blur(8px);
      display: grid; place-items: center; padding: 20px;
    }
    .chest-anim-box { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .chest-emoji { font-size: 88px; display: block; line-height: 1; animation: chestShakeAnim .55s ease-in-out 4; }
    @keyframes chestShakeAnim {
      0%,100%{transform:rotate(0) scale(1)} 20%{transform:rotate(-9deg) scale(1.13)} 40%{transform:rotate(9deg) scale(1.18)} 60%{transform:rotate(-7deg) scale(1.12)} 80%{transform:rotate(4deg) scale(1.07)}
    }
    .sparkle-ring { position: relative; width: 0; height: 0; }
    .sparkle-item {
      position: absolute; font-size: 24px; white-space: nowrap;
      animation: sparkleOut .8s ease-out forwards;
    }
    .sparkle-item:nth-child(1){--sx:-62px;--sy:-58px;}
    .sparkle-item:nth-child(2){--sx:62px;--sy:-58px;}
    .sparkle-item:nth-child(3){--sx:0;--sy:-80px;}
    .sparkle-item:nth-child(4){--sx:-88px;--sy:14px;}
    .sparkle-item:nth-child(5){--sx:88px;--sy:14px;}
    .sparkle-item:nth-child(6){--sx:-38px;--sy:-82px;}
    @keyframes sparkleOut {
      0%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(.3)}
    }
    .chest-reward-popup {
      background: linear-gradient(135deg,#fff7bf,#ffd84d 50%,#ff9c45);
      border: 3px solid rgba(255,255,255,.9); border-radius: 30px;
      padding: 24px 28px; width: min(340px, calc(100vw - 40px));
      opacity: 0; transform: scale(.6) translateY(16px);
      transition: opacity .38s ease, transform .38s cubic-bezier(.34,1.56,.64,1);
    }
    .chest-reward-popup.visible { opacity: 1; transform: scale(1) translateY(0); }
    .chest-reward-title-txt { font-size: 26px; font-weight: 1000; color: #4b2a00; margin-bottom: 6px; }
    .chest-reward-coins-txt { font-size: 34px; font-weight: 1000; color: #c05800; margin-bottom: 5px; }

    function getTodayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    function getWeekKey(date = new Date()) {
      const first = new Date(date.getFullYear(), 0, 1);
      const days = Math.floor((date - first) / 86400000);
      return `${date.getFullYear()}-W${String(Math.ceil((days + first.getDay() + 1) / 7)).padStart(2, "0")}`;
    }

    function getMonthKey(date = new Date()) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function getWeekProgressDays(date = new Date()) {
      const day = date.getDay() || 7;
      return Math.max(1, day);
    }

    function monthDistance(fromMonth, toMonth = getMonthKey()) {
      if (!fromMonth) return Infinity;
      const [fy, fm] = fromMonth.split("-").map(Number);
      const [ty, tm] = toMonth.split("-").map(Number);
      return (ty * 12 + tm) - (fy * 12 + fm);
    }

    function getYesterdayKey() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function formatKoreanDate(dateKey) {
      const [y, m, d] = dateKey.split("-");
      const date = new Date(Number(y), Number(m) - 1, Number(d));
      return `${y}년 ${Number(m)}월 ${Number(d)}일 (${["일", "월", "화", "수", "목", "금", "토"][date.getDay()]})`;
    }

    function makeKidData(kid, old = {}) {
      const xp = Number(old.xp ?? old.totalPoints ?? 0);
      const coins = Number(old.coins ?? old.currentPoints ?? 0);
      const inventory = Array.isArray(old.inventory) ? old.inventory : ["basic_avatar", "basic_bg"];
      if (!inventory.includes("basic_avatar")) inventory.push("basic_avatar");
      if (!inventory.includes("basic_bg")) inventory.push("basic_bg");
      if (!inventory.includes("basic_frame")) inventory.push("basic_frame");
      if (!inventory.includes("title_starter")) inventory.push("title_starter");
      if (!inventory.includes(kid.defaultSkin)) inventory.push(kid.defaultSkin);
      const oldEquip = old.equippedItems || {};
      const skin = oldEquip.skin || oldEquip.avatar || kid.defaultSkin || "basic_avatar";
      const headgear = oldEquip.headgear || oldEquip.head || null;
      const defaultName = defaultKidName(kid.id);
      const oldName = old.name || kid.name || defaultName;
      const migratedName = ["진우", "진영", "진환"].includes(oldName) ? defaultName : defaultName;
      const oldNickname = old.nickname || "";
      const defaultNicknames = ["진우", "진영", "진환", "복댕이", "방패 용사", "번개 러너", "불꽃 파이터", defaultName, kid.nickname, ""];
      const nickname = defaultNicknames.includes(oldNickname) ? "" : oldNickname;

      return {
        name: migratedName,
        nickname,
        avatar: old.avatar || kid.avatar,
        xp,
        coins,
        currentPoints: coins,
        totalPoints: xp,
        todayDone: old.todayDone || {},
        inventory,
        badges: Array.isArray(old.badges) ? old.badges : [],
        equippedItems: {
          skin,
          weapon: oldEquip.weapon || null,
          headgear,
          aura: oldEquip.aura || null,
          pet: oldEquip.pet || null,
          background: oldEquip.background || "basic_bg",
          frame: oldEquip.frame || "basic_frame",
          title: oldEquip.title || "title_starter",
          badge: oldEquip.badge || null,
          avatar: skin,
          head: headgear
        },
        stats: {
          weekKey: old.stats?.weekKey || getWeekKey(),
          weeklyXp: Number(old.stats?.weeklyXp || 0),
          streakDays: Number(old.stats?.streakDays || 0),
          lastActiveDate: old.stats?.lastActiveDate || null
        },
        photoPose: old.photoPose || "ready",
        favoriteBackground: old.favoriteBackground || "default"
      };
    }

    function makeGameMeta(old = {}) {
      const oldVotes = old.missionVotes?.votes || {};
      return {
        version: "1.3.9",
        soundEnabled: old.soundEnabled === true,
        lastBackupAt: old.lastBackupAt || null,
        teamMedals: Number(old.teamMedals || 0),
        rewardUsage: old.rewardUsage && typeof old.rewardUsage === "object" ? old.rewardUsage : {},

        updateNotices: old.version === "1.3.9" && Array.isArray(old.updateNotices) && old.updateNotices.length ? old.updateNotices : UPDATE_NOTICES,
        teamPhotoBackground: old.teamPhotoBackground || "default",

    function makeInitialState() {
      const kids = {};

    function loadState() {
      let loaded = null;
      try { loaded = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (error) { loaded = null; }
      const base = loaded && typeof loaded === "object" ? loaded : makeInitialState();
      const today = getTodayKey();
      const weekKey = getWeekKey();
      const migrated = {
        version: 2,
        date: base.date || today,
        selectedKidId: base.selectedKidId || KIDS[0].id,
        activeTab: base.activeTab || "character",
        familyBonuses: base.familyBonuses || {},
        dailyChests: base.dailyChests || {},
        pendingApprovals: Array.isArray(base.pendingApprovals) ? base.pendingApprovals : [],
        rewardRequests: Array.isArray(base.rewardRequests) ? base.rewardRequests : [],
        coopRewardRequests: Array.isArray(base.coopRewardRequests) ? base.coopRewardRequests : [],
        coopRewardJoins: base.coopRewardJoins && typeof base.coopRewardJoins === "object" ? base.coopRewardJoins : {},
        weeklyClosings: base.weeklyClosings && typeof base.weeklyClosings === "object" ? base.weeklyClosings : {},
        monthlyClosings: base.monthlyClosings && typeof base.monthlyClosings === "object" ? base.monthlyClosings : {},
        seasonProgress: base.seasonProgress && typeof base.seasonProgress === "object" ? base.seasonProgress : {},
        seasonClaims: base.seasonClaims && typeof base.seasonClaims === "object" ? base.seasonClaims : {},
        seasonBadges: base.seasonBadges && typeof base.seasonBadges === "object" ? base.seasonBadges : {},
        notifications: Array.isArray(base.notifications) ? base.notifications : [],
        gameMeta: makeGameMeta(base.gameMeta),
        history: Array.isArray(base.history) ? base.history.slice(0, 30) : [],
        kids: {}
      };

      KIDS.forEach((kid) => {
        migrated.kids[kid.id] = makeKidData(kid, base.kids?.[kid.id]);
        if (migrated.kids[kid.id].stats.weekKey !== weekKey) {
          migrated.kids[kid.id].stats.weekKey = weekKey;
          migrated.kids[kid.id].stats.weeklyXp = 0;
        }
      });

      if (migrated.date !== today) {
        migrated.date = today;
        migrated.familyBonuses = {};
        migrated.dailyChests = {};
        KIDS.forEach((kid) => { migrated.kids[kid.id].todayDone = {}; });
      }

      selectedKidId = KIDS.some((kid) => kid.id === migrated.selectedKidId) ? migrated.selectedKidId : KIDS[0].id;
      activeTab = migrated.activeTab || "character";
      localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
      return migrated;
    }

    function kidConfig(id) { return KIDS.find((kid) => kid.id === id) || KIDS[0]; }
    function kidData(id = selectedKidId) { return state.kids[id]; }
    function itemById(id) { return DECOR_ITEMS.find((item) => item.id === id); }
    function doneCount(id) { return QUESTS.filter((quest) => kidData(id).todayDone?.[quest.id]).length; }
    function defaultKidName(id) {

    function displayName(kidId) {
      const data = kidData(kidId);
      return data?.nickname?.trim() || data?.name || defaultKidName(kidId);
    }
    function ideaAuthorName(idea) {
      if (idea?.kidId && state.kids?.[idea.kidId]) return displayName(idea.kidId);
      return { "진우": "상어", "진영": "축복이", "진환": "복복이", "복댕이": "상어" }[idea?.kidName] || idea?.kidName || "우리 팀";
    }
    function avatarIcon(data, kid) {
      const equippedSkin = itemById(data.equippedItems?.skin || data.equippedItems?.avatar);
      if (!equippedSkin || isDefaultSkin(equippedSkin.id)) return data.avatar || kid.avatar;
      return equippedSkin ? equippedSkin.icon : (data.avatar || kid.avatar);
    }
    function isDefaultSkin(skinId) {
      return ["basic_avatar", "skin_guardian_basic", "skin_lightning_basic", "skin_fire_basic"].includes(skinId);
    }
    function avatarMarkup(data, kid, className) {
      const icon = avatarIcon(data, kid);
      const image = kid.image || "";
      const skinId = data.equippedItems ? (data.equippedItems.skin || data.equippedItems.avatar) : null;
      const useDefaultImage = !skinId || isDefaultSkin(skinId);
      return `
        <span class="${className}">
          ${image && useDefaultImage ? `<img class="avatar-img" src="${image}" alt="${kid.name} 캐릭터" onerror="this.style.display='none'">` : ""}
          <span class="avatar-fallback">${icon}</span>
        </span>`;
    }
    function getEquippedItem(kidId, slot, visualState = null) {
      const data = visualState || kidData(kidId);
      return itemById(data.equippedItems?.[slot]) || null;
    }
    function getCharacterVisualState(kidId, previewItem = null) {
      const data = kidData(kidId);
      const equippedItems = { ...data.equippedItems };
      if (previewItem) {
        const slot = itemSlot(previewItem);
        equippedItems[slot] = previewItem.id;
        if (slot === "skin") equippedItems.avatar = previewItem.id;
        if (slot === "headgear") equippedItems.head = previewItem.id;
      }
      return { ...data, equippedItems };
    }
    function visualClasses(visualState) {
      const aura = visualState.equippedItems?.aura;
      const frame = visualState.equippedItems?.frame;
      return [
        aura === "fire_aura" ? "aura-fire" : "",
        aura === "lightning_aura" ? "aura-lightning" : "",
        aura === "blue_guard_aura" ? "aura-blue" : "",
        aura === "gold_aura" ? "aura-gold" : "",
        frame === "blue_frame" ? "frame-blue" : "",
        frame === "fire_frame" ? "frame-fire" : "",
        frame === "gold_frame" ? "frame-gold" : "",
        frame === "gold_frame" || itemById(frame)?.rarity === "신화" ? "frame-mythic" : ""
      ].filter(Boolean).join(" ");
    }
    function renderCharacterAvatar(kidOrId, options = {}) {
      const kid = typeof kidOrId === "string" ? kidConfig(kidOrId) : kidOrId;
      const visualState = getCharacterVisualState(kid.id, options.previewItem || null);
      if (options.avatarOverride) {
        visualState.avatar = options.avatarOverride;
        visualState.equippedItems.skin = "basic_avatar";
        visualState.equippedItems.avatar = "basic_avatar";
      }
      const size = options.size || "big";
      const head = getEquippedItem(kid.id, "headgear", visualState) || getEquippedItem(kid.id, "head", visualState);
      const weapon = getEquippedItem(kid.id, "weapon", visualState);
      const pet = getEquippedItem(kid.id, "pet", visualState);
      const badge = getEquippedItem(kid.id, "badge", visualState);
      return `<div class="character-visual ${size} ${classCss(kid.id)} ${visualClasses(visualState)}" style="--kid-color:${kid.color};${stageVars(visualState)}">
        <div class="visual-aura"></div>
        <div class="visual-ring"></div>
        ${avatarMarkup(visualState, kid, "visual-core")}
        ${head ? `<span class="visual-layer visual-head">${head.icon}</span>` : ""}
        ${weapon ? `<span class="visual-layer visual-weapon">${weapon.icon}</span>` : ""}
        ${pet ? `<span class="visual-layer visual-pet">${pet.icon}</span>` : ""}
        ${badge ? `<span class="visual-layer visual-badge">${badge.icon}</span>` : ""}
      </div>`;
    }
    function equippedItem(data, type) {
      return itemById(data.equippedItems?.[type]) || null;
    }
    function equipLabel(data, type, fallback) {
      const item = equippedItem(data, type);
      return item ? `${item.icon} ${item.name}` : fallback;
    }
    function itemSlot(item) {
      return item?.slot || item?.type || "skin";
    }
    function className(kidId) {
      return { jinwoo: "방패 용사 · 방어형", jinyoung: "번개 러너 · 스피드형", jinhwan: "불꽃 파이터 · 공격형" }[kidId] || "미션 플레이어";
    }
    function classCss(kidId) {
      return { jinwoo: "defender", jinyoung: "runner", jinhwan: "fighter" }[kidId] || "";
    }
    function defaultAvatarChoices() {
      return ["🛡️", "⚡", "🔥", "🦸", "🤖", "🥷", "🐲", "👑", "🚀"];
    }

    function levelInfo(xp) {
      let current = LEVELS[0];
      let next = null;
      for (let i = 0; i < LEVELS.length; i += 1) {
        if (xp >= LEVELS[i].min) {
          current = LEVELS[i];
          next = LEVELS[i + 1] || null;
        }
      }
      const range = next ? next.min - current.min : 1;
      const progress = next ? Math.min(100, ((xp - current.min) / range) * 100) : 100;
      const remain = next ? Math.max(0, next.min - xp) : 0;
      return { current, next, progress, remain };
    }

    function nextUnlock(level) {
      return DECOR_ITEMS.find((item) => item.level > level) || null;
    }

    function addHistory(text) {
      const now = new Date();
      state.history.unshift({
        text,
        date: getTodayKey(),
        createdAt: now.toISOString(),
        time: `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`
      });
      state.history = state.history.slice(0, 30);
    }

    function addXpCoins(id, xp, coins) {
      const data = kidData(id);
      data.xp += xp;
      data.coins += coins;
      data.stats.weeklyXp += xp;
      const today = getTodayKey();
      if (data.stats.lastActiveDate !== today) {
        data.stats.streakDays = data.stats.lastActiveDate === getYesterdayKey() ? data.stats.streakDays + 1 : 1;
        data.stats.lastActiveDate = today;
      }
      data.currentPoints = data.coins;
      data.totalPoints = data.xp;
    }

    function spendCoins(id, coins) {
      const data = kidData(id);
      data.coins = Math.max(0, data.coins - coins);
      data.currentPoints = data.coins;
    }

    function rewardUsageBucket(rewardId, scopeId = "team") {
      state.gameMeta.rewardUsage = state.gameMeta.rewardUsage || {};
      state.gameMeta.rewardUsage[rewardId] = state.gameMeta.rewardUsage[rewardId] || {};
      state.gameMeta.rewardUsage[rewardId][scopeId] = state.gameMeta.rewardUsage[rewardId][scopeId] || {};
      return state.gameMeta.rewardUsage[rewardId][scopeId];
    }

    function rewardPeriodKey(reward) {
      if (reward.limitType === "week") return getWeekKey();
      return getMonthKey();
    }

    function rewardLimitLabel(reward) {
      if (reward.limitType === "week") return `주 ${reward.limitCount}회`;
      if (reward.limitType === "two_month") return "2개월 1회";
      return `월 ${reward.limitCount}회`;
    }

    function pendingApprovalFor(type, rewardId, kidId = null) {
      return (state.pendingApprovals || []).some((a) =>
        a.status === "pending" &&
        a.approvalType === type &&
        a.rewardId === rewardId &&
        (!kidId || a.kidId === kidId)
      );
    }

    function canRequestReward(kidId, rewardId, options = {}) {
      const reward = FAMILY_REWARDS.find((r) => r.id === rewardId);
      const data = kidData(kidId);
      const lvl = levelInfo(data.xp).current.level;
      if (!reward) return { ok: false, reason: "보상을 찾을 수 없어요." };
      if (!options.ignorePending && pendingApprovalFor("family_reward", rewardId, kidId)) return { ok: false, reason: "부모 승인 대기 중이에요." };
      if (lvl < reward.level) return { ok: false, reason: `Lv.${reward.level}에 열리는 보상이에요.` };
      if (data.coins < reward.cost) return { ok: false, reason: `코인 ${reward.cost - data.coins}개만 더 모으면 요청할 수 있어요.` };
      const bucket = rewardUsageBucket(rewardId, kidId);
      const used = Number(bucket[rewardPeriodKey(reward)] || 0);
      if (used >= reward.limitCount) return { ok: false, reason: `${rewardLimitLabel(reward)} 보상이에요. 다음 기회에 다시 도전해요.` };
      return { ok: true, reason: "부모 승인 요청 가능" };
    }

    function recordRewardUsage(kidId, rewardId) {
      const reward = FAMILY_REWARDS.find((r) => r.id === rewardId);
      if (!reward) return;
      const bucket = rewardUsageBucket(rewardId, kidId);
      const key = rewardPeriodKey(reward);
      bucket[key] = Number(bucket[key] || 0) + 1;
    }

    function averageTeamLevel() {
      return KIDS.reduce((sum, kid) => sum + levelInfo(kidData(kid.id).xp).current.level, 0) / KIDS.length;
    }

    function canRequestCoopReward(rewardId, options = {}) {
      const reward = COOP_REWARDS.find((r) => r.id === rewardId);
      if (!reward) return { ok: false, reason: "협동 보상을 찾을 수 없어요." };
      if (!options.ignorePending && pendingApprovalFor("coop_reward", rewardId)) return { ok: false, reason: "부모 승인 대기 중이에요." };
      if (averageTeamLevel() < reward.avgLevel) return { ok: false, reason: `평균 Lv.${reward.avgLevel}이 되면 도전할 수 있어요.` };
      if ((state.gameMeta.teamMedals || 0) < reward.teamMedals) return { ok: false, reason: `팀 메달 ${reward.teamMedals}개가 필요해요.` };
      const lowCoinKid = KIDS.find((kid) => kidData(kid.id).coins < reward.perKidCost);
      if (lowCoinKid) return { ok: false, reason: `${displayName(lowCoinKid.id)}가 코인을 조금 더 모으면 도전할 수 있어요.` };
      const bucket = rewardUsageBucket(rewardId, "team");
      if (reward.limitType === "two_month") {
        if (monthDistance(bucket.lastApprovedMonth) < 2) return { ok: false, reason: "2개월에 한 번 도전하는 큰 보상이에요." };
      } else {
        const used = Number(bucket[getMonthKey()] || 0);
        if (used >= reward.limitCount) return { ok: false, reason: "이번 달에는 이미 사용했어요. 다음 달에 다시 도전해요." };
      }
      return { ok: true, reason: "3형제 참여 완료 후 부모 승인 요청" };
    }

    function recordCoopRewardUsage(rewardId) {
      const reward = COOP_REWARDS.find((r) => r.id === rewardId);
      if (!reward) return;
      const bucket = rewardUsageBucket(rewardId, "team");
      const month = getMonthKey();
      bucket[month] = Number(bucket[month] || 0) + 1;
      bucket.lastApprovedMonth = month;
    }

    function seasonKey(challengeId, kidId = selectedKidId) {
      return `${getMonthKey()}_${kidId}_${challengeId}`;
    }

    function ensureSeasonProgress(kidId) {
      state.seasonProgress = state.seasonProgress || {};
      state.seasonProgress[kidId] = state.seasonProgress[kidId] || {};
      return state.seasonProgress[kidId];
    }

    function trackSeasonProgress(kidId, questId, delta = 1) {
      const progress = ensureSeasonProgress(kidId);
      SEASON_CHALLENGES.forEach((challenge) => {
        if (!challenge.match.includes(questId)) return;
        const key = `${getMonthKey()}_${challenge.id}`;
        progress[key] = Math.max(0, Number(progress[key] || 0) + delta);
      });
    }

    function getSeasonProgress(kidId, challenge) {
      const progress = ensureSeasonProgress(kidId);
      return Number(progress[`${getMonthKey()}_${challenge.id}`] || 0);
    }

    function hasSeasonClaim(kidId, challengeId) {
      state.seasonClaims = state.seasonClaims || {};
      return Boolean(state.seasonClaims[seasonKey(challengeId, kidId)]);
    }

    function syncBadges(id) {
      const data = kidData(id);
      const badges = new Set(data.badges || []);
      if (doneCount(id) >= 3) badges.add("오늘의 미션왕");
      if (data.stats.streakDays >= 3) badges.add("연속 성공왕");
      if (data.stats.weeklyXp >= 100) badges.add("이번 주 성장왕");
      if (levelInfo(data.xp).current.level >= 5) badges.add("챔피언 배지");
      data.badges = Array.from(badges);
    }

    /*
      ==============================
      효과음 시스템 (Web Audio API)
      ==============================
    */
    let _audioCtx = null;
    function getAudioCtx() {
      if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return _audioCtx;
    }
    function playSound(type) {
      if (!state.gameMeta.soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (ctx.state === "suspended") ctx.resume();
        const tone = (freq, start, dur, vol = 0.22, wave = "sine") => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.connect(g); g.connect(ctx.destination);
          osc.type = wave; osc.frequency.value = freq;
          g.gain.setValueAtTime(vol, ctx.currentTime + start);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
          osc.start(ctx.currentTime + start);
          osc.stop(ctx.currentTime + start + dur + 0.01);
        };
        switch (type) {
          case "tab":      tone(440, 0, 0.07); break;
          case "click":    tone(330, 0, 0.07); break;
          case "undo":     tone(220, 0, 0.13); break;
          case "error":    tone(180, 0, 0.1); tone(150, 0.08, 0.13); break;
          case "coin":     tone(880, 0, 0.06); tone(1100, 0.05, 0.08); break;
          case "equip":    tone(440, 0, 0.1); tone(554, 0.08, 0.15); break;
          case "clear":    tone(523, 0, 0.1); tone(659, 0.08, 0.1); tone(784, 0.16, 0.2); break;
          case "purchase": tone(523, 0, 0.08); tone(659, 0.07, 0.09); tone(784, 0.14, 0.09); tone(1047, 0.21, 0.22); break;
          case "chest":    tone(659, 0, 0.1); tone(784, 0.09, 0.1); tone(988, 0.18, 0.1); tone(1319, 0.27, 0.25); break;
          case "approval": tone(784, 0, 0.1); tone(1047, 0.09, 0.2); break;
          case "parent":   tone(440, 0, 0.06); tone(554, 0.05, 0.09); break;
          case "backup":   tone(440, 0, 0.07); tone(550, 0.06, 0.09); tone(660, 0.13, 0.15); break;
          case "levelup":  tone(523, 0, 0.08); tone(659, 0.07, 0.08); tone(784, 0.14, 0.08); tone(1047, 0.21, 0.09); tone(1319, 0.29, 0.26); break;
        }
      } catch (_) {}
    }
    function toggleSound() {
      state.gameMeta.soundEnabled = !state.gameMeta.soundEnabled;
      saveState();
      const btn = document.getElementById("soundToggle");
      if (btn) btn.textContent = state.gameMeta.soundEnabled ? "🔊" : "🔇";
      if (state.gameMeta.soundEnabled) { try { getAudioCtx().resume(); } catch (_) {} playSound("click"); }
    }

    /*

    function renderDailyChest() {
      const opened = state.dailyChests[selectedKidId];
      const cleared = doneCount(selectedKidId);
      const needed = 3;
      if (opened) {
        return `<div class="chest-section">
          <h3>🎁 오늘의 보물상자</h3>
          <p>오늘은 이미 보물상자를 열었어요. 내일 다시 도전해요! 🌟</p>
        </div>`;
      }
      if (cleared < needed) {
        return `<div class="chest-section">
          <h3>🎁 오늘의 보물상자</h3>
          <p>오늘 미션 3개를 클리어하면 보물상자를 열 수 있어요!</p>
          <div class="xp-bar" style="margin-top:6px;"><span style="width:${Math.min(100, cleared / needed * 100)}%"></span></div>
          <p style="margin-top:6px;">${cleared}/${needed} 클리어 완료</p>
        </div>`;
      }
      return `<div class="chest-section" id="chestSection">
        <h3>🎁 오늘의 보물상자</h3>
        <p>미션 3개 클리어! 보물상자를 열어봐요! 🎉</p>
        <button class="btn gold" id="openChestBtn" type="button">✨ 보물상자 열기</button>
      </div>`;
    }
    function openDailyChest() {
      if (!guardKidAction()) return;
      if (state.dailyChests[selectedKidId]) return;
      if (doneCount(selectedKidId) < 3) { playSound("error"); return; }
      const pool = [5, 5, 10, 10, 10, 15, 15, 20, 25];
      const coins = pool[Math.floor(Math.random() * pool.length)];
      playSound("chest");
      showChestAnimation(coins, () => {
        state.dailyChests[selectedKidId] = true;
        addXpCoins(selectedKidId, 0, coins);
        addHistory(`${displayName(selectedKidId)}가 오늘의 보물상자를 열고 ${coins}코인을 얻었어요! 🎁`);
        showFloatingReward(`+${coins} 코인`);
        saveAndRender(`<strong>🎁 보물상자 오픈!</strong><span>+${coins} 코인 획득!</span>`);
      });

    /*
      ==============================
      부모 승인형 특별 미션
      ==============================
    */
    function hasPendingApproval(questId, kidId = selectedKidId) {
      return (state.pendingApprovals || []).some(
        (a) => a.questId === questId && a.kidId === kidId && a.status === "pending"
      );
    }
    function requestQuestApproval(questId) {
      if (!guardKidAction()) return;
      const quest = QUESTS.find((q) => q.id === questId);
      const data = kidData();
      if (!quest || data.todayDone[questId] || hasPendingApproval(questId)) return;
      if (!Array.isArray(state.pendingApprovals)) state.pendingApprovals = [];
      state.pendingApprovals.push({
        id: `appr_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        kidId: selectedKidId,
        questId,
        questTitle: quest.title,
        xp: quest.xp,
        coins: quest.coins,
        requestedAt: new Date().toISOString(),
        status: "pending"
      });
      addHistory(`${displayName(selectedKidId)}가 특별 미션 승인을 요청했어요: ${quest.title}`);
      playSound("click");
      saveAndRender("<strong>✋ 완료 요청!</strong><span>부모님께 확인을 요청했어요 🙏</span>");
    }
    function approveQuest(approvalId) {
      const appr = (state.pendingApprovals || []).find((a) => a.id === approvalId);
      if (!appr || appr.status !== "pending") return;
      if (appr.approvalType === "family_reward") { approveFamilyReward(appr); return; }
      if (appr.approvalType === "coop_reward") { approveCoopReward(appr); return; }
      appr.status = "approved";
      const isExam = appr.approvalType === "exam_bonus";
      const before = levelInfo(kidData(appr.kidId).xp).current.level;
      if (appr.questId) {
        kidData(appr.kidId).todayDone[appr.questId] = true;
        trackSeasonProgress(appr.kidId, appr.questId, 1);
      }
      addXpCoins(appr.kidId, appr.xp, appr.coins);
      syncBadges(appr.kidId);
      const after = levelInfo(kidData(appr.kidId).xp).current.level;
      addHistory(`부모가 ${displayName(appr.kidId)}의 ${isExam ? "시험 보너스를" : "특별 미션을"} 승인했어요: ${appr.questTitle} +${appr.xp} XP / +${appr.coins} 코인`);
      addNotification(
        appr.kidId, "approval_approved",
        isExam ? "🎉 시험 보너스 승인!" : "🎉 특별 미션 승인!",
        isExam ? `${displayName(appr.kidId)}의 ${appr.subject} 시험 보너스가 승인되었어요!` : `${displayName(appr.kidId)}의 멋진 행동이 승인되었어요!`,
        `+${appr.xp} XP / +${appr.coins} 코인 획득!`
      );
      if (after > before) playSound("levelup"); else playSound("approval");
      saveAndRender(`<strong>✅ ${isExam ? "시험 보너스" : "특별 미션"} 승인!</strong><span>${displayName(appr.kidId)}에게 +${appr.xp} XP / +${appr.coins} 코인</span>`);
    }
    function rejectQuest(approvalId) {
      const appr = (state.pendingApprovals || []).find((a) => a.id === approvalId);
      if (!appr || appr.status !== "pending") return;
      if (appr.approvalType === "family_reward") {
        appr.status = "rejected";
        state.rewardRequests = (state.rewardRequests || []).map((r) => r.id === appr.id ? { ...r, status: "rejected" } : r);
        addHistory(`부모가 ${displayName(appr.kidId)}의 가족 보상을 다음 기회로 미뤘어요: ${appr.rewardName}`);
        addNotification(appr.kidId, "reward_later", "🌱 다음 기회에 다시 도전해요", `${appr.rewardName}은 코인을 더 모아 다시 요청할 수 있어요.`, "");
        playSound("undo");
        saveAndRender(`${displayName(appr.kidId)}의 가족 보상 요청을 다음 기회로 미뤘습니다.`);
        return;
      }
      if (appr.approvalType === "coop_reward") {
        appr.status = "rejected";
        if (appr.rewardId) state.coopRewardJoins[appr.rewardId] = {};
        state.coopRewardRequests = (state.coopRewardRequests || []).map((r) => r.id === appr.id ? { ...r, status: "rejected" } : r);
        addHistory(`부모가 형제 협동 보상을 다음 기회로 미뤘어요: ${appr.rewardName}`);
        KIDS.forEach((kid) => addNotification(kid.id, "coop_reward_later", "🌱 협동 보상은 다시 도전할 수 있어요", `${appr.rewardName}은 다음 기회에 다시 모아봐요.`, ""));
        playSound("undo");
        saveAndRender("협동 보상 요청을 다음 기회로 미뤘습니다.");
        return;
      }
      appr.status = "rejected";
      const isExam = appr.approvalType === "exam_bonus";
      addHistory(`부모가 ${displayName(appr.kidId)}의 ${isExam ? "시험 보너스를" : "특별 미션을"} 반려했어요: ${appr.questTitle}`);
      addNotification(
        appr.kidId, "approval_rejected",
        isExam ? "💛 다시 확인해볼까요?" : "💛 다시 도전해볼까요?",
        isExam ? "이번 시험 보너스는 다시 요청할 수 있어요. 과목과 점수를 확인해봐요!" : "이번 특별 미션은 다시 요청할 수 있어요. 더 멋진 행동으로 다시 도전해봐요!",
        ""
      );
      playSound("undo");
      saveAndRender(`${displayName(appr.kidId)}의 ${isExam ? "시험 보너스" : "특별 미션"} 요청을 반려했습니다.`);
    }

    function showChestAnimation(coins, onConfirm) {

    function addNotification(kidId, type, title, message, rewardText) {
      if (!Array.isArray(state.notifications)) state.notifications = [];
      state.notifications.unshift({
        id: `noti_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        kidId, type, title, message, rewardText: rewardText || "",
        createdAt: new Date().toISOString(), read: false
      });
      state.notifications = state.notifications.slice(0, 50);
    }
    function getUnreadNotifications(kidId) {
      return (state.notifications || []).filter((n) => n.kidId === kidId && !n.read);
    }
    function markNotificationRead(notiId) {
      const n = (state.notifications || []).find((n) => n.id === notiId);
      if (n) { n.read = true; saveState(); }
    }
    function showNextUnreadNotification(kidId) {
      const unread = getUnreadNotifications(kidId);
      if (!unread.length) return;
      const notif = unread[0];

      const isRejected = notif.type === "approval_rejected";

          ${othersCount > 0 ? `<p class="card-sub" style="text-align:center;color:var(--muted);">+ 새 알림 ${othersCount}개 더 있어요</p>` : ""}
